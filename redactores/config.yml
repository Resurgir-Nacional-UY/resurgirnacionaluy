# GENERADO por scripts/make_admin_redactores.py desde admin/config.yml.
# No editar a mano: se pisa en el próximo build.
# CMS reducido para articulistas (solo Formación y Biblioteca).

# Sveltia CMS — editor de Formación
# Autenticación: GitHub. Los "usuarios autorizados" son los miembros del equipo
# "redactores" de la organización Resurgir-Nacional-UY (con permiso Write sobre
# este repositorio).
#
# Login "Iniciar sesión con GitHub" de un clic vía el worker de OAuth
# sveltia-cms-auth en Cloudflare (base_url). También sigue disponible el login
# con token de acceso personal. Ver README-CMS.md.

backend:
  name: github
  repo: Resurgir-Nacional-UY/resurgirnacionaluy
  branch: main
  base_url: https://sveltia-cms-auth.avvedit.workers.dev

# Cada guardado abre un Pull Request; el artículo se publica al aprobarlo (merge).
publish_mode: editorial_workflow

# Imágenes subidas desde el editor. public_folder sin barra inicial: las páginas
# viven en la raíz del sitio de proyecto (/resurgirnacionaluy/), así que la ruta
# relativa resuelve bien tanto en cultura-nacional-uruguaya.html como en cada artículo.
media_folder: media/formacion
public_folder: media/formacion

collections:

  - name: formacion
    label: Artículos de Formación
    label_singular: Artículo
    description: >-
      Ensayos y textos del movimiento. Al guardar se crea un Pull Request;
      queda publicado cuando alguien con permiso lo aprueba (merge).
    folder: content/formacion
    create: true
    slug: "{{fields.slug}}"
    identifier_field: title
    summary: "{{title}} · {{date}}"
    sortable_fields:
      - date
      - title
    fields:
      - name: title
        label: Título
        widget: string

      - name: slug
        label: "Slug (parte final de la URL)"
        widget: string
        hint: "solo minúsculas, números y guiones — p. ej. la-soberania-nacional da /la-soberania-nacional.html"
        pattern:
          - "^[a-z0-9]+(?:-[a-z0-9]+)+$"
          - "Separa las palabras con guiones, todo en minúsculas (ej: la-soberania-nacional). Mejora cómo Google lee la URL."

      - name: date
        label: Fecha
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false

      - name: author
        label: Autor
        widget: string
        default: "Resurgir Nacional"

      - name: summary
        label: "Resumen (para el listado y la vista previa)"
        widget: text

      - name: source_url
        label: "Enlace externo — opcional, p. ej. el hilo en X"
        widget: string
        required: false

      - name: draft
        label: "Borrador (no se publica mientras esté marcado)"
        widget: boolean
        default: false

      - name: body
        label: "Cuerpo del artículo"
        widget: markdown

  - name: biblioteca
    label: Biblioteca
    label_singular: Libro
    description: >-
      Libros en PDF de dominio público. Al guardar se crea un Pull Request;
      queda publicado cuando alguien con permiso lo aprueba (merge).
    folder: content/biblioteca
    create: true
    extension: yaml
    format: yaml
    slug: "{{fields.slug}}"
    identifier_field: title
    summary: "{{title}} · {{author}} · {{year}}"
    sortable_fields:
      - year
      - title
    media_folder: /media/biblioteca
    public_folder: /media/biblioteca
    fields:
      - name: title
        label: Título
        widget: string

      - name: slug
        label: "Slug (parte final de la URL)"
        widget: string
        hint: "solo minúsculas, números y guiones — p. ej. jacinto-vera da /jacinto-vera.html"
        pattern:
          - "^[a-z0-9]+(?:-[a-z0-9]+)+$"
          - "Separa las palabras con guiones, todo en minúsculas (ej: la-soberania-nacional). Mejora cómo Google lee la URL."

      - name: author
        label: Autor
        widget: string

      - name: year
        label: "Año de edición"
        widget: string

      - name: summary
        label: "Resumen (para la tarjeta y la vista previa)"
        widget: text

      - name: pdf
        label: "Archivo PDF"
        widget: file
        media_library:
          config:
            max_file_size: 60000000

      - name: pages
        label: "Cantidad de páginas (opcional)"
        widget: number
        value_type: int
        required: false

      - name: draft
        label: "Borrador (no se publica mientras esté marcado)"
        widget: boolean
        default: false
