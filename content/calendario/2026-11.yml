# Calendario litúrgico del mes (forma ordinaria). Un archivo por mes (nombre = AAAA-MM.yml).
# Se edita desde el CMS (Fe · Calendario del mes). `python scripts/render_calendario.py`
# los junta en /calendario.json, que lee la pestaña Calendario de la página Fe.
mes: 2026-11
titulo: Noviembre 2026
imagen: /media/calendario/2026-11.webp
imagen_alt: 'Calendario de noviembre de 2026 (forma ordinaria): una grilla con el santo o la fiesta de cada día, bajo un detalle de La Adoración del Cordero Místico, de Jan van Eyck.'
nota: En cursiva, memoria libre. Los santos señalados como del martirologio son santos del día del Martirologio Romano que no figuran en el calendario general; su celebración es memoria libre.
