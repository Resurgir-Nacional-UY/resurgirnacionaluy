imagen: /media/calendario/2026-10.webp
imagen_alt: 'Calendario de octubre de 2026 (forma ordinaria): una grilla con el santo o la fiesta de cada día, bajo la pintura La Virgen del Rosario, de Caravaggio.'
nota: 'En cursiva, memoria libre. Los santos señalados como del martirologio son santos del día del Martirologio Romano que no figuran en el calendario general; su celebración es memoria libre.'
