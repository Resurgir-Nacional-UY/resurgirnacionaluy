# Calendario litúrgico del mes (forma ordinaria). Un archivo por mes (nombre = AAAA-MM.yml).
# Se edita desde el CMS (Fe · Calendario del mes). `python scripts/render_calendario.py`
# los junta en /calendario.json, que lee la pestaña Calendario de la página Fe.
