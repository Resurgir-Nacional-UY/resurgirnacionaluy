imagen_alt: 'Calendario de diciembre de 2026 (forma ordinaria): una grilla con el santo o la fiesta de cada día, bajo un detalle de la Natividad mística, de Sandro Botticelli.'
nota: 'En cursiva, memoria libre. Los santos señalados como del martirologio son santos del día del Martirologio Romano que no figuran en el calendario general; su celebración es memoria libre.'
