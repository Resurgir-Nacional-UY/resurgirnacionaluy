title: ARTIGAS
slug: artigas-jose-enrique-rodo
author: José Enrique Rodó
year: '1950'
summary: |-
  En 1917, los estudiantes de la “Asociación Salto” invitaron a José Enrique Rodó para que los acompañase en la peregrinación patriótica que, cada año, realizaban hasta la Meseta de Artigas. 
  El Maestro decidió concurrir, pero no pudo hacerlo. Escribió, sin embargo, el MENSAJE prometido, у confió el honor de leerlo al doctor Carlos María Prando, quien lo hizo con magnifica prestancia, en acto solemne, el 18 de julio, en la ciudad de Salto.
