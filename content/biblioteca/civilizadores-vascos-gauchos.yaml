title: Civilizadores. El drama de los gauchos euskaros
slug: civilizadores-vascos-gauchos
author: Adolfo Agorio
tema: Cultura y sociedad
year: '1947'
summary: 'En esta novela, Adolfo Agorio, mezclando datos reales y otros ficticios, nos da un acercamiento a la vida de los gauchos de origen vasco, fundadores en gran medida de nuestra patria el Uruguay. Agorio en esta obra nos expresa: "El gaucho es inaссеsible a las formas chillonas, a los gestos espectaculares, al histerismo. Es un taciturno que no se reconoce fuera de la profundidad de su propio silencio. Los eúskaros, que siguieron su huella campera, lo definieron como al ser humano auténtico, y él vivirá mientras exista alguien capaz de aquilatar la profundidad de su destino."'
