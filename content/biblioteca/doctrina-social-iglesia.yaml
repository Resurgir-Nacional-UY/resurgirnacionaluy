title: La Doctrina Social de la Iglesia
slug: doctrina-social-de-la-iglesia
author: Leon XIII, Pío XI
year: '1939'
summary: 'Un manual de DOCTRINA SOCIAL CATÓLICA no podía escribirse de mejor modo que los recopiladores de este libro lo hacen. Dejando para obras de otro carácter una labor más personal en la exposición o el comentario, de índole de este libro pedía, en efecto, el contenido de que se le ha provisto, a saber: una selección de los documentos en que se contiene lo más importante de la doctrina social de la Iglesia. Han creído, no obstante, los autores que a la transcripción de textos debieran preceder algunas consideraciones acerca del conjunto de la doctrina que en ellos se expone, y me piden que por vía de prólogo las haga. Tomando yo de entre los documentos que al lector se ofrecen aquellos que son como la fuente de donde 105 demás toman su origen, esto es, las encíclicas sociales de León XIII y de Pío XI, intentaré un examen comparativo entre ellas, del que por fuerza ha de resultar hecho ese estudio de conjunto que se desea.'
