summary: |-
  ¡Desde el Movimiento de Tercera Posición, Resurgir Nacional, les traemos con orgullo este libro! 

  "La Revolución de Marzo" es un libro que recopila los mejores discursos de Gabriel Terra, el último gran estatista y gran líder de la República Oriental del Uruguay, único gobernante de Tercera Posición que tuvo el país.
