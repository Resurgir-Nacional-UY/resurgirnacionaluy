summary: |-
  "A propósito de patrias y de patriotismo" es uno de los capítulos fundamentales de la obra Moral para intelectuales del filósofo uruguayo Carlos Vaz Ferreira (publicada originalmente en 1909 y revisada en ediciones posteriores como la de 1956).

  Vaz Ferreira critica a quienes sostienen que el progreso moral de la humanidad debe llevar necesariamente a la desaparición de las patrias. Argumenta que amar a la patria y amar a la humanidad no son sentimientos excluyentes, sino círculos concéntricos de afecto.
