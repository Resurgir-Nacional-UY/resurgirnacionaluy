title: Utopía de los usureros
slug: utopia-de-los-usureros
author: G. K. Chesterton
tema: Economía social
year: '1917'
summary: En este pequeño ensayo, el escritor católico más importante del siglo XX, Chesterton, arremete duramente contra el sistema capitalista al que califica de «maldito engendro», argumentando que destruye la libertad individual y la propiedad privada de las clases trabajadoras. Denuncia cómo los políticos y el Estado se han subordinado a los intereses de los grandes mercaderes y banqueros, convirtiendo a las naciones en administradoras de negocios privados en lugar de protectoras del bien común.
