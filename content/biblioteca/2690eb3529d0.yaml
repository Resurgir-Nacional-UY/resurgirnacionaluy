title: Historia y Política en el Uruguay
slug: ''
author: Carlos Real de Azúa
tema: Historia nacional
year: '1972'
summary: Historia y política en el Uruguay es una compilación de ensayos del ensayista, historiador y docente uruguayo Carlos Real de Azúa (1916–1977), considerado uno de los pioneros de la ciencia política en Uruguay. La obra reúne trabajos sobre la formación política, las ideologías y los procesos históricos uruguayos, con ediciones documentadas en 1972 y en 1996 por Cal y Canto.
