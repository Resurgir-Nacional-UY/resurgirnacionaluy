title: El Estado Servil
slug: el-estado-servil
author: Hilaire Beloc
tema: Economía social
year: '1945'
summary: |-
  Hilaire Beloc, junto a Chesterton, es exponente de la economía distributiva, alternativa económica católica por excelencia.

  En esta obra, El Estado Servil, Beloc expone que el equilibrio inestable de la economía moderna donde la propiedad de los medios de producción está concentrada en unos pocos, puede ser revertido mediante, según sus palabras, "la implementación del trabajo obligatorio, legalmente exigible para los que no poseen los medios de producción, en beneficio de los que lo poseen."
