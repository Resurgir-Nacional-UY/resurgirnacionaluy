title: La Leyenda Patria
slug: la-leyenda-patria
author: Juan Zorrilla de San Martín
tema: "Cultura y sociedad"
year: '1896'
summary: |-
  Poema nacional de nuestra Patria el Uruguay, escrito por el oriental Juan Zorrilla de San Martín, donde se canta la gesta heroica de los Treinta y Tres Orientales.

  "Abundancia de ideas e imágenes, gallardía y vigor tal es el plan sencillo y grande del poema. En cuanto a la ejecución, al estilo poético, me parece de todo punto admirable. Abundancia de ideas e imágenes, gallardía y vigor en la estructura del período poético, frescura y novedad; tiene Zorrilla las grandes fases del genio poético." -PABLO GROUSSAC.
