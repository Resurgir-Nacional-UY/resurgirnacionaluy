summary: Una de las obras más importantes del Uruguay, publicada en 1934, y perteneciente uno de los pensadores más importantes de nuestra nación. Roma y el espíritu de occidente de Adolfo Agorio fue una gran reflexión y estudio sobre los tiempos antes de la guerra de 1939, y sorprendentemente, muchas de las cosas plasmadas en este libro son de actualidad.
