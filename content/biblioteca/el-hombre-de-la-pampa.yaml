title: El hombre de la pampa
slug: el-hombre-de-la-pampa
author: Jules Supervielle
tema: Cultura y sociedad
year: '1969'
summary: Obra "El hombre de la pampa" del escritor uruguayo-francés Jules Supervielle (1884-1960), traducida por Juan Parra del Riego (1894-1925). Título original "L'homme de la pampa". Marcada por el humor absurdo, el lirismo vanguardista y la tensión entre el Río de la Plata y París. La obra narra el proyecto delirante de un estanciero que decide construir un volcán para romper la horizontalidad pampeana y trasladarlo luego a Francia
