summary: Constitución de la República Oriental del Uruguay realizada en el año 1934 bajo el régimen de Gabriel Terra. Esta constitución que nace como consecuencia del nuevo régimen de la llamada revolución de marzo trajo consigo cambios trascendentales para el país, y pioneros en la región como el combate contra la usura, una lucha que el sistema demoliberal que domina en nuestra patria ha dejado de lado.
