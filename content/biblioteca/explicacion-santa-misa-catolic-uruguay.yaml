title: Explicación del Santo Sacrificio de la Misa
slug: explicacion-santa-misa-catolic-uruguay
author: Pe. Martin De Cochem
tema: Fe católica
year: '1914'
summary: 'Dice San Francisco de Sales: “De todos los actos de religión, el santo sacrificio de nuestros altares resplandece como el sol entre las estrellas, porque es el alma de la piedad, centro de la religión cristiana al cual convergen todos los misterios y todos los preceptos; es el misterio inefable de la caridad divina, merced al cual, entregándose Jesucristo personalmente á nosotros, nos colma de sus gracias, por modo tan amoroso como magnánimo.“'
