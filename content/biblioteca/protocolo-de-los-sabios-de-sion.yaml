summary: Mucho se ha hablado de los famosos protocolos de los sabios de Sion, y mucho se ha debatido sobre su autenticidad. Sean los protocolos de los sabios de Sion falsos o verdaderos, lo que se expuso en ellos hace más de cien años, se ha cumplido sospechosamente casi al pie de la letra. La lectura de los protocolos se hace indispensable en los tiempos que corren.
