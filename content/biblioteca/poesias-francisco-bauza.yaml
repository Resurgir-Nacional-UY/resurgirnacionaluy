summary: Poesías, de Francisco Bauzá. Francisco Bauzá (1849–1899) fue una figura clave en la historia de Uruguay, destacado como fundador de la historiografía moderna nacional, político del Partido Colorado, legislador, diplomático y referente del catolicismo social. Su importancia radica en haber ayudado a construir el relato sobre la identidad nacional uruguaya y en su participación activa en debates políticos y sociales decisivos de la segunda mitad del siglo XIX.
