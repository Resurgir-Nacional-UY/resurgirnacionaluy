title: El Gaucho Florido
slug: el-gaucho-florido-carlos-reyles
author: Carlos Reyles
tema: Cultura y sociedad
year: '1930'
summary: Carlos Reyles, con su "Gaucho Florido", nos traslada a una época donde los campos empiezan a alambrarse y la libertad del gaucho libre comienza a desaparecer. En este escenario destaca Florido, un capataz carismático, valiente y experto en las tareas camperas que encarna el arquetipo del "gaucho perfecto".
