title: La identidad nacional y el poder político
slug: la-identidad-nacional-y-el-poder-politico
author: Dr. Álvaro Pacheco Sere
year: '1987'
summary: |-
  Este ensayo fue presentado el 7 de octubre de 1983, con el seudónimo "Derecho Viejo",
  en el concurso que sobre el tema "Historia Política del Uruguay en el siglo XX" convocaran
  "La Mañana" y "EI Diario" de Montevideo.

  En este Ensayo histórico político se analiza con rigor el origen de nuestra Nación, los poderes que combaten por su mando y la fe que nos inspira. Procura descubrir los principios que mueven los acontecimientos y quienes los dirigen. Confiere a los conceptos de Derecho Político su sentido
  natural. Aspira a que tan trascendente tema sea profundizado por aquellos a quienes sorprenda e interese su tratamiento
