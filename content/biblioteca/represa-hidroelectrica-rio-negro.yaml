title: La Resistencia de Agua
slug: represa-hidroelectrica-rio-negro
author: Pablo Thomasset, Santiago Tricánico
tema: Historia nacional
year: '2017'
summary: |-
  "El presente trabajo se propone analizar cronológicamente en nuestra historia local y mundial, la
  factibilidad técnica, hechos y evidencias históricas, respecto a la hipótesis de que Resistencia de Agua existente en la represa Rincón del Bonete, entre los años 1938 y 1943, fuese empleada para la producción de Oxido de Deuterio (Agua Pesada). Hipótesis resultante de la visita, en septiembre de 2017, de un equipo de filmación y análisis de histórico de la serie Persiguiendo a Hitler (“Hunting Hitler” Season 3 [133]) del canal de Televisión “History Channel”)."
