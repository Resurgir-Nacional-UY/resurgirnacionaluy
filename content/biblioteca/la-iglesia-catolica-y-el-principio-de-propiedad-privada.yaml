title: La Iglesia católica y el principio de la propiedad privada
slug: la-iglesia-catolica-y-el-principio-de-propiedad-privada
author: Hilaire Belloc
tema: Economía social
year: '1944'
summary: '"Un solo remedio existe contra los males del gran capitalismo, males provenientes de su rebelión fundamental contra la Iglesia Católica y de su ataque directo contra la propiedad y sus puntales. Consiste en una mejor distribución de la propiedad y del trabajo, de manera que la mayor proporción posible de familias tenga su parte en maquinarias y tierras, ambas inalienables y alienables, hasta que el número de familias así emancipadas imprima su carácter a todo el Estado." (Hilaire Belloc)'
