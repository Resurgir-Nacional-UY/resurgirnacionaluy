draft: false
lecturas:
- tipo: Primera lectura
  cita: 2 Samuel 7, 1-5. 8b-12. 14a. 16
  presentacion: Lectura del segundo libro de Samuel.
  texto: |-
    Cuando David se estableció en su casa y el Señor le dio paz, librándolo de todos sus enemigos de alrededor, el rey dijo al profeta Natán: «Mira, yo habito en una casa de cedro, mientras el Arca de Dios está en una tienda de campaña». Natán respondió al rey: «Ve a hacer todo lo que tienes pensado, porque el Señor está contigo». Pero aquella misma noche, la palabra del Señor llegó a Natán en estos términos: «Ve a decirle a mi servidor David: Así habla el Señor: ¿Eres tú el que me va a edificar una casa para que yo la habite?

    Así habla el Señor de los ejércitos: Yo te saqué del campo de pastoreo, de detrás del rebaño, para que fueras el jefe de mi pueblo Israel. Estuve contigo dondequiera que fuiste y exterminé a todos tus enemigos delante de ti. Yo haré que tu nombre sea tan grande como el de los grandes de la tierra. Fijaré un lugar para mi pueblo Israel y lo plantaré para que tenga allí su morada. Ya no será perturbado, ni los malhechores seguirán oprimiéndolo como lo hacían antes, desde el día en que establecí Jueces sobre mi pueblo Israel. Yo te he dado paz, librándote de todos tus enemigos. Y el Señor te ha anunciado que él mismo te hará una casa.

    Sí, cuando hayas llegado al término de tus días y vayas a descansar con tus padres, yo elevaré después de ti a uno de tus descendientes, a uno que saldrá de tus entrañas, y afianzaré su realeza. Seré un padre para él, y él será para mí un hijo. Tu casa y tu reino durarán eternamente delante de mí, y su trono será estable para siempre».
  cierre: Palabra de Dios.
- tipo: Salmo responsorial
  cita: Salmo 89
  estrofas: |-
    Cantaré eternamente el amor del Señor,
    proclamaré tu fidelidad por todas las generaciones.
    Porque tú has dicho: «Mi amor se mantendrá eternamente,
    mi fidelidad está afianzada en el cielo.

    Yo sellé una alianza con mi elegido,
    hice este juramento a David, mi servidor:
    «Estableceré tu descendencia para siempre,
    mantendré tu trono por todas las generaciones».

    El me dirá: «Tú eres mi padre,
    mi Dios, mi Roca salvadora».
    Le aseguraré mi amor eternamente,
    y mi alianza será estable para él.
- tipo: Segunda lectura
  cita: Romanos 16, 25-27
  presentacion: Lectura de la carta del apóstol san Pablo a los Romanos.
  texto: |-
    ¡Gloria a Dios, que tiene el poder de afianzarlos, según la Buena Noticia que yo anuncio, proclamando a Jesucristo, y revelando un misterio que fue guardado en secreto desde la eternidad y que ahora se ha manifestado! Este es el misterio que, por medio de los escritos proféticos y según el designio del Dios eterno, fue dado a conocer a todas las naciones para llevarlas a la obediencia de la fe.

    ¡A Dios, el único sabio, por Jesucristo, sea la gloria eternamente! Amén.
  cierre: Palabra de Dios.
- tipo: Evangelio
  cita: Lucas 1, 26-38
  presentacion: ✠ Lectura del santo Evangelio según san Lucas.
  texto: |-
    En el sexto mes, el ángel Gabriel fue enviado por Dios a una ciudad de Galilea, llamada Nazaret, a una virgen que estaba comprometida con un hombre perteneciente a la familia de David, llamado José. El nombre de la virgen era María. El Angel entró en su casa y la saludó, diciendo: «¡Alégrate!, llena de gracia, el Señor está contigo». Al oír estas palabras, ella quedó desconcertada y se preguntaba qué podía significar ese saludo.

    Pero el Angel le dijo: «No temas, María, porque Dios te ha favorecido. Concebirás y darás a luz un hijo, y le pondrás por nombre Jesús; él será grande y será llamado Hijo del Altísimo. El Señor Dios le dará el trono de David, su padre, reinará sobre la casa de Jacob para siempre y su reino no tendrá fin». María dijo al Angel: «¿Cómo puede ser eso, si yo no tengo relaciones con ningún hombre?».

    El Angel le respondió: «El Espíritu Santo descenderá sobre ti y el poder del Altísimo te cubrirá con su sombra. Por eso el niño será Santo y será llamado Hijo de Dios. También tu parienta Isabel concibió un hijo a pesar de su vejez, y la que era considerada estéril, ya se encuentra en su sexto mes, porque no hay nada imposible para Dios». María dijo entonces: «Yo soy la servidora del Señor, que se cumpla en mí lo que has dicho».Y el Angel se alejó.
  cierre: Palabra del Señor.
