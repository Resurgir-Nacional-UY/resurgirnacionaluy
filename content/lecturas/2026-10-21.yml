# Lecturas de la Santa Misa del día. Un archivo por fecha (nombre = AAAA-MM-DD.yml).
# Se edita desde el CMS (Fe · Lecturas del día). `python scripts/render_lecturas.py`
# los junta en /lecturas.json, que lee la página Fe para mostrar la lectura de hoy.
fecha: '2026-10-21'
celebracion: Miércoles de la XXIX semana del tiempo ordinario
santo: 'Memoria libre (santo del martirologio): San Hilarión'
fuente: 'Texto bíblico: El Libro del Pueblo de Dios (traducción argentina, 1990), tal como lo publica la Santa Sede en vatican.va.'
draft: false
lecturas:
- tipo: Primera lectura
  cita: Efesios 3, 2-12
  presentacion: Lectura de la carta del apóstol san Pablo a los Efesios.
  texto: |-
    Porque seguramente habrán oído hablar de la gracia de Dios, que me ha sido dispensada en beneficio de ustedes. Fue por medio de una revelación como se me dio a conocer este misterio, tal como acabo de exponérselo en pocas palabras. Al leerlas, se darán cuenta de la comprensión que tengo del misterio de Cristo, que no fue manifestado a las generaciones pasadas, pero que ahora ha sido revelado por medio del Espíritu a sus santos apóstoles y profetas.

    Este misterio consiste en que también los paganos participan de una misma herencia, son miembros de un mismo Cuerpo y beneficiarios de la misma promesa en Cristo Jesús, por medio del Evangelio. De este Evangelio, yo fui constituido ministro por el don de la gracia que recibí de Dios, en virtud de la eficacia de su poder. Yo, el menor de todos los santos, he recibido la gracia de anunciar a los paganos la insondable riqueza de Cristo, y poner de manifiesto la dispensación del misterio que estaba oculto desde siempre en Dios, el creador de todas las cosas, para que los Principados y las Potestades celestiales conozcan la infinita variedad de la sabiduría de Dios por medio de la Iglesia.

    Este es el designio que Dios concibió desde toda la eternidad en Cristo Jesús, nuestro Señor, por quien nos atrevemos a acercarnos a Dios con toda confianza, mediante la fe en él.
  cierre: Palabra de Dios.
- tipo: Salmo responsorial
  cita: Isaías 12, 2-6
  estrofas: |-
    Este es el Dios de mi salvación: yo tengo confianza y no temo, porque el Señor es mi fuerza y mi protección; él fue mi salvación.
    Ustedes sacarán agua con alegría de las fuentes de la salvación.

    Den gracias al Señor, invoquen su Nombre, anuncien entre los pueblos sus proezas, proclamen qué sublime es su Nombre

    Canten al Señor porque ha hecho algo grandioso: ¡que sea conocido en toda la tierra!
    ¡Aclama y grita de alegría. habitante de Sión, porque es grande en medio de ti el Santo de Israel!
- tipo: Evangelio
  cita: Lucas 12, 39-48
  presentacion: ✠ Lectura del santo Evangelio según san Lucas.
  texto: |-
    Entiéndalo bien: si el dueño de casa supiera a qué hora va a llegar el ladrón, no dejaría perforar las paredes de su casa. Ustedes también estén preparados, porque el Hijo del hombre llegará a la hora menos pensada». Pedro preguntó entonces: «Señor, ¿esta parábola la dices para nosotros o para todos?». El Señor le dijo: «¿Cuál es el administrador fiel y previsor, a quien el Señor pondrá al frente de su personal para distribuirle la ración de trigo en el momento oportuno?

    ¡Feliz aquel a quien su señor, al llegar, encuentra ocupado en este trabajo! Les aseguro que lo hará administrador de todos sus bienes. Pero si este servidor piensa: "Mi señor tardará en llegar", y se dedica a golpear a los servidores y a las sirvientas, y se pone a comer, a beber y a emborracharse, su señor llegará el día y la hora menos pensada, lo castigará y le hará correr la misma suerte que los infieles.

    El servidor que, conociendo la voluntad de su señor, no tuvo las cosas preparadas y no obró conforme a lo que él había dispuesto, recibirá un castigo severo. Pero aquel que sin saberlo, se hizo también culpable, será castigado menos severamente. Al que se le dio mucho, se le pedirá mucho; y al que se le confió mucho, se le reclamará mucho más.
  cierre: Palabra del Señor.
