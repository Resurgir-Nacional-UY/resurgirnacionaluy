# Lecturas de la Santa Misa del día. Un archivo por fecha (nombre = AAAA-MM-DD.yml).
# Se edita desde el CMS (Fe · Lecturas del día). `python scripts/render_lecturas.py`
# los junta en /lecturas.json, que lee la página Fe para mostrar la lectura de hoy.
fecha: '2026-10-28'
celebracion: Miércoles de la XXX semana del tiempo ordinario
santo: 'Fiesta: Santos Simón y Judas, apóstoles'
fuente: 'Texto bíblico: La Sagrada Biblia, traducción de Mons. Juan Straubinger.'
draft: false
lecturas:
- tipo: Primera lectura
  cita: Efesios 2, 19-22
  presentacion: Lectura de la carta del apóstol san Pablo a los Efesios.
  texto: |-
    de modo que ya no sois extranjeros ni advenedizos sino que sois conciudadanos de los santos y miembros de la familia de Dios, edificados sobre el fundamento de los apóstoles y profetas, siendo piedra angular el mismo Cristo Jesús, en quien todo el edificio, armónicamente trabado, crece para templo santo en el Señor.

    En Él sois también vosotros coedificados en el Espíritu para morada de Dios.
  cierre: Palabra de Dios.
- tipo: Salmo responsorial
  cita: Salmo 18
  estrofas: |-
    Los cielos atestiguan la gloria de Dios;
    y el firmamento predica las obras
    que Él ha hecho.
    Cada día transmite
    al siguiente este mensaje,
    y una noche lo hace conocer a la otra.

    Si bien no es la palabra,
    tampoco es un lenguaje
    cuya voz no pueda percibirse.
    Por toda la tierra se oye su sonido,
    y sus acentos hasta los confines del orbe.
- tipo: Evangelio
  cita: Lucas 6, 12-19
  presentacion: ✠ Lectura del santo Evangelio según san Lucas.
  texto: |-
    Por aquellos días se salió a la montaña para orar, y pasó toda la noche en oración con Dios. Cuando se hizo de día, llamó a sus discípulos, y de entre ellos eligió a doce a los que dio el nombre de apóstoles: a Simón, a quien también llamó Pedro, y a Andrés el hermano de éste; a Santiago y Juan; a Felipe y Bartolomé; a Mateo y Tomás; a Santiago (hijo) de Alfeo, y Simón llamado el celoso; a Judas de Santiago, y a Judas Iscariote, el que llegó a ser el traidor.

    Con éstos descendió y se estuvo de pie en un lugar llano, donde había un gran número de sus discípulos y una gran muchedumbre del pueblo de toda la Judea y de Jerusalén, y de la costa de Tiro y de Sidón, los cuales habían venido a oírlo y a que los sanara de sus enfermedades; y también los atormentados de espíritus inmundos eran sanados.

    Y toda la gente quería tocarlo, porque de Él salía virtud y sanaba a todos.
  cierre: Palabra del Señor.
