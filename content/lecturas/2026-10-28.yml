# Lecturas de la Santa Misa del día. Un archivo por fecha (nombre = AAAA-MM-DD.yml).
# Se edita desde el CMS (Fe · Lecturas del día). `python scripts/render_lecturas.py`
# los junta en /lecturas.json, que lee la página Fe para mostrar la lectura de hoy.
fecha: '2026-10-28'
celebracion: Miércoles de la XXX semana del tiempo ordinario
santo: 'Fiesta: Santos Simón y Judas, apóstoles'
fuente: 'Texto bíblico: El Libro del Pueblo de Dios (traducción argentina, 1990), tal como lo publica la Santa Sede en vatican.va.'
draft: false
lecturas:
- tipo: Primera lectura
  cita: Efesios 2, 19-22
  presentacion: Lectura de la carta del apóstol san Pablo a los Efesios.
  texto: |-
    Por lo tanto, ustedes ya no son extranjeros ni huéspedes, sino conciudadanos de los santos y miembros de la familia de Dios. Ustedes están edificados sobre los apóstoles y los profetas, que son los cimientos, mientras que la piedra angular es el mismo Jesucristo. En él, todo el edificio, bien trabado, va creciendo para constituir un templo santo en el Señor. En él, también ustedes son incorporados al edificio, para llegar a ser una morada de Dios en el Espíritu.
  cierre: Palabra de Dios.
- tipo: Salmo responsorial
  cita: Salmo 19
  estrofas: |-
    El cielo proclama la gloria de Dios
    y el firmamento anuncia la obra de sus manos;
    un día transmite al otro este mensaje
    y las noches se van dando la noticia.

    Sin hablar, sin pronunciar palabras,
    sin que se escuche su voz,
    resuena su eco por toda la tierra
    y su lenguaje, hasta los confines del mundo.
- tipo: Evangelio
  cita: Lucas 6, 12-19
  presentacion: ✠ Lectura del santo Evangelio según san Lucas.
  texto: |-
    En esos días, Jesús se retiró a una montaña para orar, y pasó toda la noche en oración con Dios. Cuando se hizo de día, llamó a sus discípulos y eligió a doce de ellos, a los que dio el nombre de Apóstoles: Simón, a quien puso el sobrenombre de Pedro, Andrés, su hermano, Santiago, Juan, Felipe, Bartolomé, Mateo, Tomás, Santiago, hijo de Alfeo, Simón, llamado el Zelote, Judas, hijo de Santiago y Judas Iscariote, que fue el traidor.

    Al bajar con ellos se detuvo en una llanura. Estaban allí muchos de sus discípulos y una gran muchedumbre que había llegado de toda la Judea, de Jerusalén y de la región costera de Tiro y Sidón, para escucharlo y hacerse curar de sus enfermedades. Los que estaban atormentados por espíritus impuros quedaban curados; y toda la gente quería tocarlo, porque salía de él una fuerza que sanaba a todos.
  cierre: Palabra del Señor.
