# Lecturas de la Santa Misa del día. Un archivo por fecha (nombre = AAAA-MM-DD.yml).
# Se edita desde el CMS (Fe · Lecturas del día). `python scripts/render_lecturas.py`
# los junta en /lecturas.json, que lee la página Fe para mostrar la lectura de hoy.
fecha: '2026-10-22'
celebracion: Jueves de la XXIX semana del tiempo ordinario
santo: 'Memoria libre: San Juan Pablo II, papa'
fuente: 'Texto bíblico: El Libro del Pueblo de Dios (traducción argentina, 1990), tal como lo publica la Santa Sede en vatican.va.'
draft: false
lecturas:
- tipo: Primera lectura
  cita: Efesios 3, 14-21
  presentacion: Lectura de la carta del apóstol san Pablo a los Efesios.
  texto: |-
    Por eso doblo mis rodillas delante del Padre, de quien procede toda paternidad en el cielo y en la tierra. Que él se digne fortificarlos por medio de su Espíritu, con forme a la riqueza de su gloria, para que crezca en ustedes el hombre interior. Que Cristo habite en sus corazones por la fe, y sean arraigados y edificados en el amor. Así podrán comprender, con todos los santos, cuál es la anchura y la longitud, la altura y la profundidad, en una palabra, ustedes podrán conocer el amor de Cristo, que supera todo conocimiento, para ser colmados por la plenitud de Dios.

    ¡A aquel que es capaz de hacer infinitamente más de lo que podemos pedir o pensar, por el poder que obra en nosotros, a él sea la gloria en la Iglesia y en Cristo Jesús, por todas las generaciones y para siempre! Amén.
  cierre: Palabra de Dios.
- tipo: Salmo responsorial
  cita: Salmo 33
  estrofas: |-
    Aclamen, justos, al Señor;
    es propio de los buenos alabarlo.
    Alaben al Señor con la cítara,
    toquen en su honor el arpa de diez cuerdas;

    Porque la palabra del Señor es recta
    y él obra siempre con lealtad;
    él ama la justicia y el derecho,
    y la tierra está llena de su amor.

    pero el designio del Señor permanece para siempre,
    y sus planes, a lo largo de las generaciones.
    ¡Feliz la nación cuyo Dios es el Señor,
    el pueblo que él se eligió como herencia!

    Los ojos del Señor están fijos sobre sus fieles,
    sobre los que esperan en su misericordia,
    para librar sus vidas de la muerte
    y sustentarlos en el tiempo de indigencia.
- tipo: Evangelio
  cita: Lucas 12, 49-53
  presentacion: ✠ Lectura del santo Evangelio según san Lucas.
  texto: |-
    Yo he venido a traer fuego sobre la tierra, ¡y cómo desearía que ya estuviera ardiendo! Tengo que recibir un bautismo, ¡y qué angustia siento hasta que esto se cumpla plenamente! ¿Piensan ustedes que he venido a traer la paz a la tierra? No, les digo que he venido a traer la división. De ahora en adelante, cinco miembros de una familia estarán divididos, tres contra dos y dos contra tres: el padre contra el hijo y el hijo contra el padre, la madre contra la hija y la hija contra la madre, la suegra contra la nuera y la nuera contra la suegra».
  cierre: Palabra del Señor.
