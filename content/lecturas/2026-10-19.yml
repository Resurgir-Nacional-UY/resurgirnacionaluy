# Lecturas de la Santa Misa del día. Un archivo por fecha (nombre = AAAA-MM-DD.yml).
# Se edita desde el CMS (Fe · Lecturas del día). `python scripts/render_lecturas.py`
# los junta en /lecturas.json, que lee la página Fe para mostrar la lectura de hoy.
fecha: '2026-10-19'
celebracion: Lunes de la XXIX semana del tiempo ordinario
santo: 'Memoria libre: San Pablo de la Cruz; o Santos Juan de Brébeuf e Isaac Jogues, presbíteros, y compañeros, mártires'
fuente: 'Texto bíblico: El Libro del Pueblo de Dios (traducción argentina, 1990), tal como lo publica la Santa Sede en vatican.va.'
draft: false
lecturas:
- tipo: Primera lectura
  cita: Efesios 2, 1-10
  presentacion: Lectura de la carta del apóstol san Pablo a los Efesios.
  texto: |-
    Ustedes estaban muertos a causa de las faltas y pecados que cometían, cuando vivían conforme al criterio de este mundo, según el Príncipe que domina en el espacio, el mismo Espíritu que sigue actuando en aquellos que se rebelan. Todos nosotros también nos comportábamos así en otro tiempo, viviendo conforme a nuestros deseos carnales y satisfaciendo nuestra concupiscencia y nuestras malas inclinaciones, de manera que por nuestra condición estábamos condenados a la ira, igual que los demás.

    Pero Dios, que es rico en misericordia, por el gran amor con que nos amó, precisamente cuando estábamos muertos a causa de nuestros pecados, nos hizo revivir con Cristo –¡ustedes han sido salvados gratuitamente!– y con Cristo Jesús nos resucitó y nos hizo reinar con él en el cielo. Así, Dios ha querido demostrar a los tiempos futuros la inmensa riqueza de su gracia por el amor que nos tiene en Cristo Jesús.

    Porque ustedes han sido salvados por su gracia, mediante la fe. Esto no proviene de ustedes, sino que es un don de Dios; y no es el resultado de las obras, para que nadie se gloríe. Nosotros somos creación suya: fuimos creados en Cristo Jesús, a fin de realizar aquellas buenas obras, que Dios preparó de antemano para que las practicáramos.
  cierre: Palabra de Dios.
- tipo: Salmo responsorial
  cita: Salmo 100
  estrofas: |-
    Aclame al Señor toda la tierra,
    sirvan al Señor con alegría,
    lleguen hasta él con cantos jubilosos.

    Reconozcan que el Señor es Dios:
    él nos hizo y a él pertenecemos;
    somos su pueblo y ovejas de su rebaño.

    Entren por sus puertas dando gracias,
    entren en sus atrios con himnos de alabanza,
    alaben al Señor y bendigan su Nombre.

    ¡Qué bueno es el Señor!
    Su misericordia permanece para siempre,
    y su fidelidad por todas las generaciones.
- tipo: Evangelio
  cita: Lucas 12, 13-21
  presentacion: ✠ Lectura del santo Evangelio según san Lucas.
  texto: |-
    Uno de la multitud le dijo: «Maestro, dile a mi hermano que comparta conmigo la herencia». Jesús le respondió: «Amigo, ¿quién me ha constituido juez o árbitro entre ustedes?». Después les dijo: «Cuídense de la abundancia, la vida de un hombre no está asegurada por sus riquezas». Les dijo entonces una parábola: «Había un hombre rico, cuyas tierras habían producido mucho, y se preguntaba a sí mismo "¿Qué voy a hacer? No tengo dónde guardar mi cosecha".

    Después pensó: "Voy a hacer esto: demoleré mis graneros, construiré otros más grandes y amontonaré allí todo mi trigo y mis bienes, y diré a mi alma: Alma mía, tienes bienes almacenados para muchos años; descansa, como, bebe y date buena vida". Pero Dios le dijo: "Insensato, esta misma noche vas a morir. ¿Y para quién será lo que has amontonado?". Esto es lo que sucede al que acumula riquezas para sí, y no es rico a los ojos de Dios».
  cierre: Palabra del Señor.
