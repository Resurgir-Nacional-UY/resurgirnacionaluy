# Lecturas de la Santa Misa del día. Un archivo por fecha (nombre = AAAA-MM-DD.yml).
# Se edita desde el CMS (Fe · Lecturas del día). `python scripts/render_lecturas.py`
# los junta en /lecturas.json, que lee la página Fe para mostrar la lectura de hoy.
fecha: '2026-10-18'
celebracion: XXIX Domingo del tiempo ordinario
santo: ''
fuente: 'Texto bíblico: El Libro del Pueblo de Dios (traducción argentina, 1990), tal como lo publica la Santa Sede en vatican.va.'
draft: false
lecturas:
- tipo: Primera lectura
  cita: Isaías 45, 1. 4-6
  presentacion: Lectura del libro de Isaías.
  texto: |-
    Así habla el Señor a su ungido, a Ciro, a quien tomé de la mano derecha, para someter ante él a las naciones y desarmar a los reyes para abrir ante él las puertas de las ciudades, de manera que no puedan cerrarse. Por amor a Jacob, mi servidor, y a Israel, mi elegido, yo te llamé por tu nombre, te di un título insigne, sin que tú me conocieras. Yo soy el Señor, y no hay otro, no hay ningún Dios fuera de mí, Yo hice empuñar las armas, sin que tú me conocieras, para que se conozca, desde el Oriente y el Occidente, que no hay nada fuera de mí. Yo soy el Señor, y no hay otro.
  cierre: Palabra de Dios.
- tipo: Salmo responsorial
  cita: Salmo 96
  estrofas: |-
    Canten al Señor un canto nuevo,
    cante al Señor toda la tierra;
    Anuncien su gloria entre las naciones,
    y sus maravillas entre los pueblos.

    Porque el Señor es grande y muy digno de alabanza,
    más temible que todos los dioses.
    Los dioses de los pueblos no son más que apariencia,
    pero el Señor hizo el cielo;

    Aclamen al Señor, familias de los pueblos,
    aclamen la gloria y el poder del Señor;
    aclamen la gloria del nombre del Señor.

    adoren al Señor al manifestarse su santidad:
    ¡que toda la tierra tiemble ante él!
    Digan entre las naciones: «¡el Señor reina!
    El Señor juzgará a los pueblos con rectitud».
- tipo: Segunda lectura
  cita: 1 Tesalonicenses 1, 1-5
  presentacion: Lectura de la primera carta del apóstol san Pablo a los Tesalonicenses.
  texto: |-
    Pablo, Silvano y Timoteo saludan a la Iglesia de Tesalónica, que está unida a Dios Padre y al Señor Jesucristo. Llegue a ustedes la gracia y la paz. Siempre damos gracias a Dios por todos ustedes, cuando los recordamos en nuestras oraciones, y sin cesar tenemos presente delante de Dios, nuestro Padre, cómo ustedes han manifestado su fe con obras, su amor con fatigas y su esperanza en nuestro Señor Jesucristo con una firme constancia.

    Sabemos, hermanos amados por Dios, que ustedes han sido elegidos. Porque la Buena Noticia que les hemos anunciado llegó hasta ustedes, no solamente con palabras, sino acompañada de poder, de la acción del Espíritu Santo y de toda clase de dones.
  cierre: Palabra de Dios.
- tipo: Evangelio
  cita: Mateo 22, 15-21
  presentacion: ✠ Lectura del santo Evangelio según san Mateo.
  texto: |-
    Los fariseos se reunieron entonces para sorprender a Jesús en alguna de sus afirmaciones. Y le enviaron a varios discípulos con unos herodianos, para decirle: «Maestro, sabemos que eres sincero y que enseñas con toda fidelidad el camino de Dios, sin tener en cuenta la condición de las personas, porque tú no te fijas en la categoría de nadie. Dinos qué te parece: ¿Está permitido pagar el impuesto al César o no?».

    Pero Jesús, conociendo su malicia, les dijo: «Hipócritas, ¿por qué me tienden una trampa? Muéstrenme la moneda con que pagan el impuesto». Ellos le presentaron un denario. Y él les preguntó: «¿De quién es esta figura y esta inscripción?». Le respondieron: «Del César». Jesús les dijo: «Den al César lo que es del César, y a Dios, lo que es de Dios».
  cierre: Palabra del Señor.
