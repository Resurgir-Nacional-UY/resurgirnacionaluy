# los junta en /lecturas.json, que lee la página Fe para mostrar la lectura de hoy.
fecha: '2026-11-24'
celebracion: Martes de la XXXIV semana del tiempo ordinario
santo: 'Memoria obligatoria: Santos Andrés Dung-Lac, presbítero, y compañeros, mártires'
fuente: 'Texto bíblico: El Libro del Pueblo de Dios (traducción argentina, 1990), tal como lo publica la Santa Sede en vatican.va.'
imagen: /media/lecturas/2026-11-24.jpg
imagen_credito: 'Francesco Hayez, «La destrucción del templo de Jerusalén» (1867)'
titulo_miniatura: 'No quedará piedra sobre piedra'
draft: false
lecturas:
- tipo: Primera lectura
  cita: Apocalipsis 14, 14-19
  presentacion: Lectura del libro del Apocalipsis.
  texto: |-
    Y vi una nube blanca, sobre la cual estaba sentado alguien que parecía Hijo de hombre, con una corona de oro en la cabeza y una hoz afilada en la mano. En seguida salió del Templo otro Angel y gritó con voz potente al que estaba sentado sobre la nube: «Empuña tu hoz y siega, porque ha llegado el tiempo de la cosecha y los sembrados de la tierra están maduros». Y el que estaba sentado sobre la nube pasó su hoz sobre la tierra, y esta quedó segada.

    Entonces otro Angel salió del Templo que está en el cielo, llevando también una hoz afilada. Y salió del altar otro Angel –el que tiene poder sobre el fuego– y gritó con voz potente al que tenía la hoz afilada: «Empuña tu hoz y cosecha los racimos de la viña de la tierra, porque han llegado a su madurez». El Angel pasó la hoz afilada sobre la tierra, cosechó la viña y arrojó los racimos en la inmensa cuba de la ira de Dios.
  cierre: Palabra de Dios.
- tipo: Salmo responsorial
  cita: Salmo 96
  estrofas: |-
    Digan entre las naciones: «¡el Señor reina!
    El mundo está firme y no vacilará.
    El Señor juzgará a los pueblos con rectitud».

    Alégrese el cielo y exulte la tierra,
    resuene el mar y todo lo que hay en él;
    regocíjese el campo con todos sus frutos,
    griten de gozo los árboles del bosque.

    Griten de gozo delante del Señor,
    porque él viene a gobernar la tierra:
    él gobernará al mundo con justicia,
    y a los pueblos con su verdad.
- tipo: Evangelio
  cita: Lucas 21, 5-11
  presentacion: ✠ Lectura del santo Evangelio según san Lucas.
  texto: |-
    Y como algunos, hablando del Templo, decían que estaba adornado con hermosas piedras y ofrendas votivas, Jesús dijo: «De todo lo que ustedes contemplan, un día no quedará piedra sobre piedra: todo será destruido». Ellos le preguntaron» «Maestro, ¿cuándo tendrá lugar esto, y cuál será la señal de que va suceder?». Jesús respondió: «Tengan cuidado, no se dejen engañar, porque muchos se presentarán en mi Nombre, diciendo: "Soy yo", y también: "El tiempo está cerca". No los sigan.

    Cuando oigan hablar de guerras y revoluciones no se alarmen; es necesario que esto ocurra antes, pero no llegará tan pronto el fin». Después les dijo: «Se levantará nación contra nación y reino contra reino. Habrá grandes terremotos; peste y hambre en muchas partes; se verán también fenómenos aterradores y grandes señales en cielo.
  cierre: Palabra del Señor.
