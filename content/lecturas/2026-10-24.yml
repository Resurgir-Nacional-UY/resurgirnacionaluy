# Lecturas de la Santa Misa del día. Un archivo por fecha (nombre = AAAA-MM-DD.yml).
# Se edita desde el CMS (Fe · Lecturas del día). `python scripts/render_lecturas.py`
# los junta en /lecturas.json, que lee la página Fe para mostrar la lectura de hoy.
fecha: '2026-10-24'
celebracion: Sábado de la XXIX semana del tiempo ordinario
santo: 'Memoria libre: San Antonio María Claret'
fuente: 'Texto bíblico: El Libro del Pueblo de Dios (traducción argentina, 1990), tal como lo publica la Santa Sede en vatican.va.'
draft: false
lecturas:
- tipo: Primera lectura
  cita: Efesios 4, 7-16
  presentacion: Lectura de la carta del apóstol san Pablo a los Efesios.
  texto: |-
    Sin embargo, cada uno de nosotros ha recibido su propio don, en la medida que Cristo los ha distribuido. Por eso dice la Escritura: "Cuando subió a lo alto, llevó consigo a los cautivos y repartió dones a los hombres". Pero si decimos que subió, significa que primero descendió a las regiones inferiores de la tierra. El que descendió es el mismo que subió más allá de los cielos, para colmar todo el universo.

    El comunicó a unos el don de ser apóstoles, a otros profetas, a otros predicadores del Evangelio, a otros pastores o maestros. Así organizó a los santos para la obra del ministerio, en orden a la edificación del Cuerpo de Cristo, hasta que todos lleguemos a la unidad de la fe y del conocimiento del Hijo de Dios, al estado de hombre perfecto y a la madurez que corresponde a la plenitud de Cristo.

    Así dejaremos de ser niños, sacudidos por las olas y arrastrados por el viento de cualquier doctrina, a merced de la malicia de los hombres y de su astucia para enseñar el error. Por el contrario, viviendo en la verdad y en el amor, crezcamos plenamente, unidos a Cristo. El es la Cabeza, y de él, todo el Cuerpo recibe unidad y cohesión, gracias a los ligamentos que lo vivifican y a la acción armoniosa de todos los miembros. Así el Cuerpo crece y se edifica en el amor.
  cierre: Palabra de Dios.
- tipo: Salmo responsorial
  cita: Salmo 122
  estrofas: |-
    ¡Qué alegría cuando me dijeron:
    «Vamos a la Casa del Señor»!
    Nuestros pies ya están pisando
    tus umbrales, Jerusalén.

    Jerusalén, que fuiste construida
    como ciudad bien compacta y armoniosa.
    Allí suben las tribus, las tribus del Señor
    –según es norma en Israel–

    para celebrar el nombre del Señor.
    Porque allí está el trono de la justicia,
    el trono de la casa de David.
- tipo: Evangelio
  cita: Lucas 13, 1-9
  presentacion: ✠ Lectura del santo Evangelio según san Lucas.
  texto: |-
    En ese momento se presentaron unas personas que comentaron a Jesús el caso de aquellos galileos, cuya sangre Pilato mezcló con la de las víctimas de sus sacrificios. El respondió: «¿Creen ustedes que esos galileos sufrieron todo esto porque eran más pecadores que los demás? Les aseguro que no, y si ustedes no se convierten, todos acabarán de la misma manera. ¿O creen que las dieciocho personas que murieron cuando se desplomó la torre de Siloé, eran más culpables que los demás habitantes de Jerusalén?

    Les aseguro que no, y si ustedes no se convierten, todos acabarán de la misma manera». Les dijo también esta parábola: «Un hombre tenía una higuera plantada en su viña. Fue a buscar frutos y nos encontró. Dijo entonces al viñador: "Hace tres años que vengo a buscar frutos en esta higuera y nos encuentro. Córtala, ¿para qué malgastar la tierra?". Pero él respondió: "Señor, déjala todavía este año; yo removeré la tierra alrededor de ella y la abonaré.

    Puede ser que así dé frutos en adelante. Si no, la cortarás"».
  cierre: Palabra del Señor.
