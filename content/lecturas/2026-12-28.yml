fecha: '2026-12-28'
celebracion: Día IV de la Octava de Navidad
santo: 'Fiesta: Santos Inocentes, mártires'
fuente: 'Texto bíblico: El Libro del Pueblo de Dios (traducción argentina, 1990), tal como lo publica la Santa Sede en vatican.va.'
imagen: /media/lecturas/2026-12-28.jpg
imagen_credito: Guido Reni, «La matanza de los inocentes» (1611)
titulo_miniatura: Los Santos Inocentes
draft: false
lecturas:
- tipo: Primera lectura
  cita: 1 Juan 1, 5 – 2, 2
  presentacion: Lectura de la primera carta del apóstol san Juan.
  texto: |-
    La noticia que hemos oído de él y que nosotros les anunciamos, es esta: Dios es luz, y en él no hay tinieblas. Si decimos que estamos en comunión con él y caminamos en las tinieblas, mentimos y no procedemos conforme a la verdad. Pero si caminamos en la luz, como el mismo está en la luz, estamos en comunión unos con otros, y la sangre de su Hijo Jesús nos purifica de todo pecado.

    Si decimos que no tenemos pecado, nos engañamos a nosotros mismos y la verdad no está en nosotros. Si confesamos nuestros pecados, él es fiel y justo para perdonarnos y purificarnos de toda maldad. Si decimos que no hemos pecado, lo hacemos pasar por mentiroso, y su palabra no está en nosotros. Hijos míos, les he escrito estas cosas para que no pequen. Pero si alguno peca, tenemos un defensor ante el Padre: Jesucristo, el Justo.

    El es la Víctima propiciatoria por nuestros pecados, y no sólo por los nuestros, sino también por los del mundo entero.
  cierre: Palabra de Dios.
- tipo: Salmo responsorial
  cita: Salmo 124
  estrofas: |-
    si el Señor no hubiera estado de nuestra parte,
    cuando los hombres se alzaron contra nosotros,
    nos habrían devorado vivos.
    Cuando ardió su furor contra nosotros,

    las aguas nos habrían inundado,
    un torrente nos habría sumergido,
    nos habrían sumergido las aguas turbulentas.

    la trampa se rompió y nosotros escapamos.
    Nuestra ayuda está en el nombre del Señor,
    que hizo el cielo y la tierra.
- tipo: Evangelio
  cita: Mateo 2, 13-18
  presentacion: ✠ Lectura del santo Evangelio según san Mateo.
  texto: |-
    Después de la partida de los magos, el Angel del Señor se apareció en sueños a José y le dijo: «Levántate, toma al niño y a su madre, huye a Egipto y permanece allí hasta que yo te avise, porque Herodes va a buscar al niño para matarlo». José se levantó, tomó de noche al niño y a su madre, y se fue a Egipto. Allí permaneció hasta la muerte de Herodes, para que se cumpliera lo que el Señor había anunciado por medio del Profeta: "Desde Egipto llamé a mi hijo".

    Al verse engañado por los magos, Herodes se enfureció y mandó matar, en Belén y sus alrededores, a todos los niños menores de dos años, de acuerdo con la fecha que los magos le habían indicado. Así se cumplió lo que había sido anunciado por el profeta Jeremías: "En Ramá se oyó una voz, hubo lágrimas y gemidos: es Raquel, que llora a sus hijos y no quiere que la consuelen, porque ya no existen".
  cierre: Palabra del Señor.
