draft: false
lecturas:
- tipo: Primera lectura
  cita: Ezequiel 47, 1-2. 8-9. 12
  presentacion: Lectura de la profecía de Ezequiel.
  texto: |-
    El hombre me hizo volver a la entrada de la Casa, y vi que salía agua por debajo del umbral de la Casa, en dirección al oriente, porque la fachada de la Casa miraba hacia el oriente. El agua descendía por debajo del costado derecho de la Casa, al sur del Altar. Luego me sacó por el camino de la puerta septentrional, y me hizo dar la vuelta por un camino exterior, hasta la puerta exterior que miraba hacia el oriente. Allí vi que el agua fluía por el costado derecho.

    Entonces me dijo: «Estas aguas fluyen hacia el sector oriental, bajan hasta la estepa y van a desembocar en el Mar. Se las hace salir hasta el Mar, para que sus aguas sean saneadas. Hasta donde llegue el torrente, tendrán vida todos los seres vivientes que se mueven por el suelo y habrá peces en abundancia. Porque cuando esta agua llegue hasta el Mar, sus aguas quedarán saneadas, y habrá vida en todas parte adonde llegue el torrente.

    Al borde del torrente, sobre sus dos orillas, crecerán árboles frutales de todas las especies. No se marchitarán sus hojas ni se agotarán sus frutos, y todos los meses producirán nuevos frutos, porque el agua sale del Santuario. Sus frutos servirán de alimento y sus hojas de remedio».
  cierre: Palabra de Dios.
- tipo: Salmo responsorial
  cita: Salmo 46
  estrofas: |-
    Dios es nuestro refugio y fortaleza,
    una ayuda siempre pronta en los peligros.
    Por eso no tememos, aunque la tierra se conmueva
    y las montañas se desplomen hasta el fondo del mar;

    Los canales del Río alegran la Ciudad de Dios,
    la más santa Morada del Altísimo.
    Dios está en medio de ella: nunca vacilará;
    él la socorrerá al despuntar la aurora.

    El Señor de los ejércitos está con nosotros,
    nuestro baluarte es el Dios de Jacob.
    Vengan a contemplar las obras del Señor,
    él hace cosas admirables en la tierra.
- tipo: Evangelio
  cita: Juan 2, 13-22
  presentacion: ✠ Lectura del santo Evangelio según san Juan.
  texto: |-
    Se acercaba la Pascua de los judíos. Jesús subió a Jerusalén y encontró en el Templo a los vendedores de bueyes, ovejas y palomas y a los cambistas sentados delante de sus mesas. Hizo un látigo de cuerdas y los echó a todos del Templo, junto con sus ovejas y sus bueyes; desparramó las monedas de los cambistas, derribó sus mesas y dijo a los vendedores de palomas: «Saquen esto de aquí y no hagan de la casa de mi Padre una casa de comercio».

    Y sus discípulos recordaron las palabras de la Escritura: El celo por tu Casa me consumirá. Entonces los judíos le preguntaron: «¿Qué signo nos das para obrar así?». Jesús les respondió: «Destruyan este templo y en tres días lo volveré a levantar». Los judíos le dijeron: «Han sido necesarios cuarenta y seis años para construir este Templo, ¿y tú lo vas a levantar en tres días?».

    Pero él se refería al templo de su cuerpo. Por eso, cuando Jesús resucitó, sus discípulos recordaron que él había dicho esto, y creyeron en la Escritura y en la palabra que había pronunciado.
  cierre: Palabra del Señor.
