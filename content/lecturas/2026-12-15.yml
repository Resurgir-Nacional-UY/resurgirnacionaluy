fecha: '2026-12-15'
celebracion: Martes de la III semana de Adviento
santo: ''
fuente: 'Texto bíblico: El Libro del Pueblo de Dios (traducción argentina, 1990), tal como lo publica la Santa Sede en vatican.va.'
imagen: /media/lecturas/2026-12-15.jpg
imagen_credito: Caravaggio, «La vocación de san Mateo» (1599-1600)
titulo_miniatura: Los publicanos creyeron en Juan
draft: false
lecturas:
- tipo: Primera lectura
  cita: Sofonías 3, 1-2. 9-13
  presentacion: Lectura de la profecía de Sofonías.
  texto: |-
    ¡Ay de la rebelde, de la impura, de la ciudad opresora! Ella no escuchó el llamado, no aprendió la lección, no puso su confianza en el Señor ni se acercó a su Dios. Entonces, yo haré que sean puros los labios de los pueblos, para que todos invoquen el nombre el Señor y lo sirvan con el mismo empeño. Desde más allá de los ríos de Cus, mis adoradores, los que están dispersos, me traerán ofrendas.

    Aquel día, ya no tendrás que avergonzarte de las malas acciones con las que me has ofendido, porque yo apartaré a esos jactanciosos prepotentes que están en medio de ti, y ya no volverás a engreírte sobre mi santa Montaña. Yo dejaré en medio de ti a un pueblo pobre y humilde, que se refugiará en el nombre del Señor. El resto de Israel no cometerá injusticias ni hablará falsamente; y no se encontrarán en su boca palabras engañosas. Ellos pacerán y descansarán sin que nadie los perturbe.
  cierre: Palabra de Dios.
- tipo: Salmo responsorial
  cita: Salmo 34
  estrofas: |-
    Bendeciré al Señor en todo tiempo,
    su alabanza estará siempre en mis labios.
    Mi alma se gloría en el Señor;
    que lo oigan los humildes y se alegren.

    Miren hacia él y quedarán resplandecientes,
    y sus rostros no se avergonzarán.
    Este pobre hombre invocó al Señor:
    él lo escuchó y los salvó de sus angustias.

    pero el Señor rechaza a los que hacen el mal
    para borrar su recuerdo de la tierra.
    Cuando ellos claman, el Señor los escucha
    y los libra de todas sus angustias.

    El Señor está cerca del que sufre
    y salva a los que están abatidos.
    Pero el Señor rescata a sus servidores,
    y los que se refugian en él no serán castigados.
- tipo: Evangelio
  cita: Mateo 21, 28-32
  presentacion: ✠ Lectura del santo Evangelio según san Mateo.
  texto: |-
    «¿Qué les parece? Un hombre tenía dos hijos y, dirigiéndose al primero, le dijo: "Hijo, quiero que hoy vayas a trabajar a mi viña". El respondió: "No quiero". Pero después se arrepintió y fue. Dirigiéndose al segundo, le dijo lo mismo y este le respondió: "Voy, Señor", pero no fue. ¿Cuál de los dos cumplió la voluntad de su padre?». «El primero», le respondieron. Jesús les dijo: «Les aseguro que los publicanos y las prostitutas llegan antes que ustedes al Reino de Dios.

    En efecto, Juan vino a ustedes por el camino de la justicia y no creyeron en él; en cambio, los publicanos y las prostitutas creyeron en él. Pero ustedes, ni siquiera al ver este ejemplo, se han arrepentido ni han creído en él.
  cierre: Palabra del Señor.
