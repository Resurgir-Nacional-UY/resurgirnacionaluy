fecha: '2026-11-03'
celebracion: Martes de la XXXI semana del tiempo ordinario
santo: 'Memoria libre: San Martín de Porres, religioso'
fuente: 'Texto bíblico: El Libro del Pueblo de Dios (traducción argentina, 1990), tal como lo publica la Santa Sede en vatican.va.'
