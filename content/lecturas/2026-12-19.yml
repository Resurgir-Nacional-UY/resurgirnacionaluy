lecturas:
- tipo: Primera lectura
  cita: Jueces 13, 2-7. 24-25a
  presentacion: Lectura del libro de los Jueces.
  texto: |-
    Había un hombre de Sorá, del clan de los danitas, que se llamaba Manóaj. Su mujer era estéril y no tenía hijos. El Angel del Señor se apareció a la mujer y le dijo: «Tú eres estéril y no has tenido hijos, pero vas a concebir y a dar a luz un hijo. Ahora, deja de beber vino o cualquier bebida fermentada, y no comas nada impuro. Porque concebirás y darás a luz un hijo. La navaja nunca pasará por su cabeza, porque el niño estará consagrado a Dios desde el seno materno. El comenzará a salvar a Israel del poder de los filisteos».

    La mujer fue a decir a su marido: «Un hombre de Dios ha venido a verme. Su aspecto era tan imponente, que parecía un ángel de Dios. Yo no le pregunté de dónde era, ni él me dio a conocer su nombre. Peor me dijo: «Concebirás y darás a luz un hijo. En adelante, no bebas vino, ni comas nada impuro, porque el niño estará consagrado a Dios desde el seno de su madres hasta el día de su muerte».

    La mujer dio a luz un hijo y lo llamó Sansón. El niño creció y el Señor lo bendijo. Y el espíritu del Señor comenzó a actuar sobre él.
  cierre: Palabra de Dios.
- tipo: Salmo responsorial
  cita: Salmo 71
  estrofas: |-
    Sé para mí una roca protectora,
    tú que decidiste venir siempre en mi ayuda,
    porque tú eres mi Roca y mi fortaleza.
    ¡Líbrame, Dios mío, de las manos del impío,

    Porque tú, Señor, eres mi esperanza
    y mi seguridad desde mi juventud.
    En ti me apoyé desde las entrañas de mi madre;
    desde el seno materno fuiste mi protector,

    Vendré a celebrar las proezas del Señor,
    evocaré tu justicia, que es sólo tuya.
    Dios mío, tú me enseñaste desde mi juventud,
    y hasta hoy he narrado tus maravillas.
- tipo: Evangelio
  cita: Lucas 1, 5-25
  presentacion: ✠ Lectura del santo Evangelio según san Lucas.
  texto: |-
    En tiempos de Herodes, rey de Judea, había un sacerdote llamado Zacarías, de la clase sacerdotal de Abías. Su mujer, llamada Isabel, era descendiente de Aarón. Ambos eran justos a los ojos de Dios y seguían en forma irreprochable todos los mandamientos y preceptos del Señor. Pero no tenían hijos, porque Isabel era estéril; y los dos eran de edad avanzada. Un día en que su clase estaba de turno y Zacarías ejercía la función sacerdotal delante de Dios, le tocó en suerte, según la costumbre litúrgica, entrar en el Santuario del Señor para quemar el incienso.

    Toda la asamblea del pueblo permanecía afuera, en oración, mientras se ofrecía el incienso. Entonces se le apareció el Angel del Señor, de pie, a la derecha del altar del incienso. Al verlo, Zacarías quedó desconcertado y tuvo miedo. Pero el Angel le dijo: «No temas, Zacarías; tu súplica ha sido escuchada. Isabel, tu esposa, te dará un hijo al que llamarás Juan. El será para ti un motivo de gozo y de alegría, y muchos se alegrarán de su nacimiento, porque será grande a los ojos del Señor. No beberá vino ni bebida alcohólica; estará lleno del Espíritu Santo desde el seno de su madre, y hará que muchos israelitas vuelvan al Señor, su Dios.

    Precederá al Señor con el espíritu y el poder de Elías, para reconciliar a los padres con sus hijos y atraer a los rebeldes a la sabiduría de los justos, preparando así al Señor un Pueblo bien dispuesto». Pero Zacarías dijo al Angel: «¿Cómo puedo estar seguro de esto? Porque yo soy anciano y mi esposa es de edad avanzada». El Angel le respondió: «Yo soy Gabriel, el que está delante de Dios, y he sido enviado para hablarte y anunciarte esta buena noticia.

    Te quedarás mudo, sin poder hablar hasta el día en que sucedan estas cosas, por no haber creído en mis palabras, que se cumplirán a su debido tiempo». Mientras tanto, el pueblo estaba esperando a Zacarías, extrañado de que permaneciera tanto tiempo en el Santuario. Cuando salió, no podía hablarles, y todos comprendieron que había tenido alguna visión en el Santuario. El se expresaba por señas, porque había quedado mudo.

    Al cumplirse el tiempo de su servicio en el Templo, regresó a su casa. Poco después, su esposa Isabel concibió un hijo y permaneció oculta durante cinco meses. Ella pensaba: «Esto es lo que el Señor ha hecho por mí, cuando decidió librarme de lo que me avergonzaba ante los hombres».
  cierre: Palabra del Señor.
