# Lecturas de la Santa Misa del día. Un archivo por fecha (nombre = AAAA-MM-DD.yml).
# Se edita desde el CMS (Fe · Lecturas del día). `python scripts/render_lecturas.py`
# los junta en /lecturas.json, que lee la página Fe para mostrar la lectura de hoy.
fecha: '2026-10-23'
celebracion: Viernes de la XXIX semana del tiempo ordinario
santo: 'Memoria libre: San Juan de Capistrano, presbítero'
fuente: 'Texto bíblico: El Libro del Pueblo de Dios (traducción argentina, 1990), tal como lo publica la Santa Sede en vatican.va.'
draft: false
lecturas:
- tipo: Primera lectura
  cita: Efesios 4, 1-6
  presentacion: Lectura de la carta del apóstol san Pablo a los Efesios.
  texto: |-
    Yo, que estoy preso por el Señor, los exhorto a comportarse de una manera digna de la vocación que han recibido. Con mucha humildad, mansedumbre y paciencia, sopórtense mutuamente por amor. Traten de conservar la unidad del Espíritu mediante el vínculo de la paz. Hay un solo Cuerpo y un solo Espíritu, así como hay una misma esperanza, a la que ustedes han sido llamados, de acuerdo con la vocación recibida.

    hay un solo Señor, una sola fe, un solo bautismo. Hay un solo Dios y Padre de todos, que está sobre todos, lo penetra todo y está en todos.
  cierre: Palabra de Dios.
- tipo: Salmo responsorial
  cita: Salmo 24
  estrofas: |-
    Del Señor es la tierra y todo lo que hay en ella,
    el mundo y todos sus habitantes
    porque él la fundó sobre los mares,
    él la afirmó sobre las corrientes del océano.

    ¿Quién podrá subir a la Montaña del Señor
    y permanecer en su recinto sagrado?
    El que tiene las manos limpias
    y puro el corazón;

    él recibirá la bendición del Señor,
    la recompensa de Dios, su Salvador.
    Así son los que buscan al Señor,
    los que buscan tu rostro, Dios de Jacob.
- tipo: Evangelio
  cita: Lucas 12, 54-59
  presentacion: ✠ Lectura del santo Evangelio según san Lucas.
  texto: |-
    Dijo también a la multitud: «Cuando ven que una nube se levanta en occidente, ustedes dicen en seguida que va a llover, y así sucede. Y cuando sopla viento del sur, dicen que hará calor, y así sucede. ¡Hipócritas! Ustedes saben discernir el aspecto de la tierra y del cielo; ¿cómo entonces no saben discernir el tiempo presente? ¿Por qué no juzgan ustedes mismos lo que es justo? Cuando vas con tu adversario a presentarte ante el magistrado, trata de llegar a un acuerdo con él en el camino, no sea que el adversario te lleve ante el juez, y el juez te entregue al guardia, y este te ponga en la cárcel.

    Te aseguro que no saldrás de allí hasta que hayas pagado el último centavo».
  cierre: Palabra del Señor.
