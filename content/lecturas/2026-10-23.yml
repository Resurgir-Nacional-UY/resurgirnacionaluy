# Lecturas de la Santa Misa del día. Un archivo por fecha (nombre = AAAA-MM-DD.yml).
# Se edita desde el CMS (Fe · Lecturas del día). `python scripts/render_lecturas.py`
# los junta en /lecturas.json, que lee la página Fe para mostrar la lectura de hoy.
fecha: '2026-10-23'
celebracion: Viernes de la XXIX semana del tiempo ordinario
santo: 'Memoria libre: San Juan de Capistrano, presbítero'
fuente: 'Texto bíblico: La Sagrada Biblia, traducción de Mons. Juan Straubinger.'
draft: false
lecturas:
- tipo: Primera lectura
  cita: Efesios 4, 1-6
  presentacion: Lectura de la carta del apóstol san Pablo a los Efesios.
  texto: |-
    Os ruego, pues, yo, el prisionero en el Señor, que caminéis de una manera digna del llamamiento que se os ha hecho, con toda humildad de espíritu y mansedumbre, con longanimidad, sufriéndoos unos a otros con caridad, esforzándoos por guardar la unidad del Espíritu en el vínculo de la paz.

    Uno es el cuerpo y uno el Espíritu, y así también una la esperanza de la vocación a que habéis sido llamados; uno el Señor, una la fe, uno el bautismo, uno el Dios y Padre de todos, el cual es sobre todo, en todo y en todos.
  cierre: Palabra de Dios.
- tipo: Salmo responsorial
  cita: Salmo 23
  estrofas: |-
    De Yahvé es la tierra
    y cuanto ella contiene;
    el orbe y cuantos lo habitan.
    Porque Él la asentó sobre mares
    y la afirmó sobre corrientes.

    ¿Quién será digno
    de ascender al monte de Yahvé?
    y ¿quién estará en su santuario?
    Aquel que tiene inmaculadas las manos
    y puro el corazón.

    Él recibirá la bendición de Yahvé,
    y la justicia de Dios su Salvador.

    Esta es la generación
    de los que lo buscan,
    de los que buscan tu faz,
    (Dios de) Jacob.
- tipo: Evangelio
  cita: Lucas 12, 54-59
  presentacion: ✠ Lectura del santo Evangelio según san Lucas.
  texto: |-
    Dijo también a la muchedumbre: “Cuando veis una nube levantarse al poniente, luego decís: “Va a llover”. Y eso sucede. Y cuando sopla el viento del mediodía, decís: “Habrá calor”. Y eso sucede. Hipócritas, sabéis conocer el aspecto de la tierra y del cielo; ¿por qué entonces no conocéis este tiempo? ¿Por qué no juzgáis por vosotros mismos lo que es justo? Mientras vas con tu adversario en busca del magistrado, procura en el camino librarte de él, no sea que te arrastre ante el juez, que el juez te entregue al alguacil y que el alguacil te meta en la cárcel. Yo te lo declaro, no saldrás de allí hasta que no hayas reintegrado el último lepte”.
  cierre: Palabra del Señor.
