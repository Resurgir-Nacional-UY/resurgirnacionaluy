# Lecturas de la Santa Misa del día. Un archivo por fecha (nombre = AAAA-MM-DD.yml).
# Se edita desde el CMS (Fe · Lecturas del día). `python scripts/render_lecturas.py`
# los junta en /lecturas.json, que lee la página Fe para mostrar la lectura de hoy.
fecha: '2026-11-23'
celebracion: Lunes de la XXXIV semana del tiempo ordinario
santo: 'Memoria libre: San Clemente I, papa y mártir; o San Columbano, abad'
fuente: 'Texto bíblico: El Libro del Pueblo de Dios (traducción argentina, 1990), tal como lo publica la Santa Sede en vatican.va.'
imagen: /media/lecturas/2026-11-23.jpg
imagen_credito: 'James Tissot, «La ofrenda de la viuda» (c. 1890)'
titulo_miniatura: 'La ofrenda de la viuda'
draft: false
lecturas:
- tipo: Primera lectura
  cita: Apocalipsis 14, 1-3. 4b-5
  presentacion: Lectura del libro del Apocalipsis.
  texto: |-
    Después vi al Cordero que estaba de pie sobre el monte Sión, acompañado de ciento cuarenta y cuatro mil elegidos, que tenían escrito en la frente el nombre del Cordero y de su Padre. Oí entonces una voz que venía del cielo, semejante al estrépito de un torrente y al ruido de un fuerte trueno, y esa voz era como un concierto de arpas: los elegidos cantaban un canto nuevo delante del trono de Dios, y delante de los cuatro Seres Vivientes y de los Ancianos. Y nadie podía aprender este himno, sino los ciento cuarenta y cuatro mil que habían sido rescatados de la tierra.

    Ellos siguen al Cordero donde quiera que vaya. Han sido los primeros hombres rescatados para Dios y para el Cordero. En su boca nunca hubo mentira y son inmaculados.
  cierre: Palabra de Dios.
- tipo: Salmo responsorial
  cita: Salmo 24
  estrofas: |-
    Del Señor es la tierra y todo lo que hay en ella,
    el mundo y todos sus habitantes
    porque él la fundó sobre los mares,
    él la afirmó sobre las corrientes del océano.

    ¿Quién podrá subir a la Montaña del Señor
    y permanecer en su recinto sagrado?
    El que tiene las manos limpias
    y puro el corazón;

    él recibirá la bendición del Señor,
    la recompensa de Dios, su Salvador.
    Así son los que buscan al Señor,
    los que buscan tu rostro, Dios de Jacob.
- tipo: Evangelio
  cita: Lucas 21, 1-4
  presentacion: ✠ Lectura del santo Evangelio según san Lucas.
  texto: |-
    Después, levantado los ojos, Jesús vio a unos ricos que ponían sus ofrendas en el tesoro del Templo. Vio también a una viuda de condición muy humilde, que ponía dos pequeñas monedas de cobre, y dijo: «Les aseguro que esta pobre viuda ha dado más que a nadie. Porque todos los demás dieron como ofrenda algo de lo que les sobraba, pero ella, de su indigencia, dio todo lo que tenía para vivir».
  cierre: Palabra del Señor.
