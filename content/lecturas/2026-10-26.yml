# Lecturas de la Santa Misa del día. Un archivo por fecha (nombre = AAAA-MM-DD.yml).
# Se edita desde el CMS (Fe · Lecturas del día). `python scripts/render_lecturas.py`
# los junta en /lecturas.json, que lee la página Fe para mostrar la lectura de hoy.
fecha: '2026-10-26'
celebracion: Lunes de la XXX semana del tiempo ordinario
santo: 'Memoria libre (santo del martirologio): San Evaristo'
fuente: 'Texto bíblico: El Libro del Pueblo de Dios (traducción argentina, 1990), tal como lo publica la Santa Sede en vatican.va.'
draft: false
lecturas:
- tipo: Primera lectura
  cita: Efesios 4, 32 – 5, 8
  presentacion: Lectura de la carta del apóstol san Pablo a los Efesios.
  texto: |-
    Por el contrario, sean mutuamente buenos y compasivos, perdonándose los unos a los otros como Dios los ha perdonado en Cristo. Traten de imitar a Dios, como hijos suyos muy queridos. Practiquen el amor, a ejemplo de Cristo, que nos amó y se entregó por nosotros, como ofrenda y sacrificio agradable a Dios. En cuanto al pecado carnal y cualquier clase de impureza o avaricia, ni siquiera se los mencione entre ustedes, como conviene a los santos.

    Lo mismo digo acerca de las obscenidades, de las malas conversaciones y de las bromas groseras: todo esto está fuera de lugar. Lo que deben hacer es dar gracias a Dios. Y sépanlo bien: ni el hombre lujurioso, ni el impuro, ni el avaro –que es un idólatra– tendrán parte en la herencia del Reino de Cristo y de Dios. No se dejen engañar por falsas razones: todo eso atrae la ira de Dios sobre los que se resisten a obedecerle.

    No se hagan cómplices de los que obran así! Antes, ustedes eran tinieblas, pero ahora son luz en el Señor. Vivan como hijos de la luz.
  cierre: Palabra de Dios.
- tipo: Salmo responsorial
  cita: Salmo 1
  estrofas: |-
    ¡Feliz el hombre
    que no sigue el consejo de los malvados,
    ni se detiene en el camino de los pecadores,
    ni se sienta en la reunión de los impíos,
    sino que se complace en la ley del Señor
    y la medita de día y de noche!

    El es como un árbol
    plantado al borde de las aguas,
    que produce fruto a su debido tiempo,
    y cuyas hojas nunca se marchitan:
    todo lo que haga le saldrá bien.

    No sucede así con los malvados:
    ellos son como paja que se lleva el viento.
    porque el Señor cuida el camino de los justos,
    pero el camino de los malvados termina mal.
- tipo: Evangelio
  cita: Lucas 13, 10-17
  presentacion: ✠ Lectura del santo Evangelio según san Lucas.
  texto: |-
    Un sábado, Jesús enseñaba en una sinagoga. Había allí una mujer poseída de un espíritu, que la tenía enferma desde hacía dieciocho años. Estaba completamente encorvada y no podía enderezarse de ninguna manera. Jesús, al verla, la llamó y le dijo: «Mujer, estás curada de tu enfermedad», y le impuso las manos. Ella se enderezó en seguida y glorificaba a Dios. Pero el jefe de la sinagoga, indignado porque Jesús había curado en sábado, dijo a la multitud: «Los días de trabajo son seis; vengan durante esos días para hacerse curar, y no el sábado».

    El Señor le respondió: «¡Hipócritas! Cualquiera de ustedes, aunque sea sábado, ¿no desata del pesebre a su buey o a su asno para llevarlo a beber? Y esta hija de Abraham, a la que Satanás tuvo aprisionada durante dieciocho años, ¿no podía ser librada de sus cadenas el día sábado?». Al oír estas palabras, todos sus adversarios se llenaron de confusión, pero la multitud se alegraba de las maravillas que él hacía.
  cierre: Palabra del Señor.
