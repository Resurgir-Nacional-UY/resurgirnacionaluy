# Lecturas de la Santa Misa del día. Un archivo por fecha (nombre = AAAA-MM-DD.yml).
# Se edita desde el CMS (Fe · Lecturas del día). `python scripts/render_lecturas.py`
# los junta en /lecturas.json, que lee la página Fe para mostrar la lectura de hoy.
fecha: '2026-10-27'
celebracion: Martes de la XXX semana del tiempo ordinario
santo: 'Memoria libre (santo del martirologio): Santos Vicente, Sabina y Cristeta'
fuente: 'Texto bíblico: El Libro del Pueblo de Dios (traducción argentina, 1990), tal como lo publica la Santa Sede en vatican.va.'
draft: false
lecturas:
- tipo: Primera lectura
  cita: Efesios 5, 21-33
  presentacion: Lectura de la carta del apóstol san Pablo a los Efesios.
  texto: |-
    Sométanse los unos a los otros, por consideración a Cristo. Las mujeres deben respetar a su marido como al Señor, porque el varón es la cabeza de la mujer, como Cristo es la Cabeza y el Salvador de la Iglesia, que es su Cuerpo. Así como la Iglesia está sometida a Cristo, de la misma manera las mujeres deben respetar en todo a su marido. Maridos, amen a su esposa, como Cristo amó a la Iglesia y se entregó por ella, para santificarla. El la purificó con el bautismo del agua y la palabra, porque quiso para sí una Iglesia resplandeciente, sin mancha ni arruga y sin ningún defecto, sino santa e inmaculada.

    Del mismo modo, los maridos deben amar a su mujer como a su propio cuerpo. El que ama a su esposa se ama a sí mismo. Nadie menosprecia a su propio cuerpo, sino que lo alimenta y lo cuida. Así hace Cristo por la Iglesia, por nosotros, que somos los miembros de su Cuerpo. Por eso, el hombre dejará a su padre y a su madre para unirse a su mujer, y los dos serán una sola carne. Este es un gran misterio: y yo digo que se refiere a Cristo y a la Iglesia.

    En cuanto a ustedes, cada uno debe amar a su mujer como así mismo, y la esposa debe respetar a su marido.
  cierre: Palabra de Dios.
- tipo: Salmo responsorial
  cita: Salmo 128
  estrofas: |-
    ¡Feliz el que teme al Señor
    y sigue sus caminos!
    Comerás del fruto de tu trabajo,
    serás feliz y todo te irá bien.

    Tu esposa será como una vid fecunda
    en el seno de tu hogar;
    tus hijos, como retoños de olivo
    alrededor de tu mesa.

    ¡Así será bendecido
    el hombre que teme al Señor!
    ¡Que el Señor te bendiga desde Sión
    todos los días de tu vida:
    que contemples la paz de Jerusalén
- tipo: Evangelio
  cita: Lucas 13, 18-21
  presentacion: ✠ Lectura del santo Evangelio según san Lucas.
  texto: |-
    Jesús dijo entonces: «¿A qué se parece el Reino de Dios? ¿Con qué podré compararlo? Se parece a un grano de mostaza que un hombre sembró en su huerta; creció, se convirtió en un arbusto y los pájaros del cielo se cobijaron en sus ramas». Dijo también: «¿Con qué podré comparar el Reino de Dios? Se parece a un poco de levadura que una mujer mezcló con gran cantidad de harina, hasta que fermentó toda la masa».
  cierre: Palabra del Señor.
