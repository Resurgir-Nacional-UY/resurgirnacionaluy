# Lecturas de la Santa Misa del día. Un archivo por fecha (nombre = AAAA-MM-DD.yml).
# Se edita desde el CMS (Fe · Lecturas del día). `python scripts/render_lecturas.py`
# los junta en /lecturas.json, que lee la página Fe para mostrar la lectura de hoy.
fecha: '2026-10-29'
celebracion: Jueves de la XXX semana del tiempo ordinario
santo: 'Memoria libre (santo del martirologio): San Narciso'
fuente: 'Texto bíblico: El Libro del Pueblo de Dios (traducción argentina, 1990), tal como lo publica la Santa Sede en vatican.va.'
draft: false
lecturas:
- tipo: Primera lectura
  cita: Efesios 6, 10-20
  presentacion: Lectura de la carta del apóstol san Pablo a los Efesios.
  texto: |-
    Por lo demás, fortalézcanse en el Señor con la fuerza de su poder. Revístanse con la armadura de Dios, para que puedan resistir las insidias del demonio. Porque nuestra lucha no es contra enemigos de carne y sangre, sino contra los Principados y Potestades, contra los Soberanos de este mundo de tinieblas, contra los espíritus del mal que habitan en el espacio. Por lo tanto, tomen la armadura de Dios, para que puedan resistir en el día malo y mantenerse firmes después de haber superado todos los obstáculos.

    Permanezcan de pie, ceñidos con el cinturón de la verdad y vistiendo la justicia como coraza. Calcen sus pies con el celo para propagar la Buena Noticia de la paz. Tengan siempre en la mano el escudo de la fe, con el que podrán apagar todas las flechas encendidas del Maligno. Tomen el casco de la salvación, y la espada del Espíritu, que es la Palabra de Dios. Eleven constantemente toda clase de oraciones y súplicas, animadas por el Espíritu. Dedíquense con perseverancia incansable a interceder por todos los hermanos, y también por mí, a fin de que encuentre palabras adecuadas para anunciar resueltamente el misterio del Evangelio, del cual yo soy embajador en medio de mis cadenas. ¡Así podré hablar libremente de él, como debo hacerlo!
  cierre: Palabra de Dios.
- tipo: Salmo responsorial
  cita: Salmo 144
  estrofas: |-
    Bendito sea el Señor, mi Roca,
    el que adiestra mis brazos para el combate
    y mis manos para la lucha.

    El es mi bienhechor y mi fortaleza,
    mi baluarte y mi libertador;
    él es el escudo con que me resguardo,
    y el que somete los pueblos a mis pies.

    Dios mío, yo quiero cantarte un canto nuevo
    y tocar para ti con el arpa de diez cuerdas,
    porque tú das la victoria a los reyes
    y libras a David, tu servidor.
- tipo: Evangelio
  cita: Lucas 13, 31-35
  presentacion: ✠ Lectura del santo Evangelio según san Lucas.
  texto: |-
    En ese momento se acercaron algunos fariseos que le dijeron: «Aléjate de aquí, porque Herodes quiere matarte». El les respondió: «Vayan a decir a ese zorro: hoy y mañana expulso a los demonios y realizo curaciones, y al tercer día habré terminado. Pero debo seguir mi camino hoy, mañana y pasado, porque no puede ser que un profeta muera fuera de Jerusalén. ¡Jerusalén, Jerusalén, que matas a los profetas y apedreas a los que te son enviados! ¡Cuántas veces quise reunir a tus hijos, como la gallina reúne bajo sus alas a los pollitos, y tú no quisiste!

    Por eso, a ustedes la casa les quedará vacía. Les aseguro que ya no me verán más, hasta que llegue el día en que digan: ¡Bendito el viene en nombre del Señor!».
  cierre: Palabra del Señor.
