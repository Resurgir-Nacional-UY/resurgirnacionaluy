fecha: '2026-11-19'
celebracion: Jueves de la XXXIII semana del tiempo ordinario
santo: 'Memoria libre (santo del martirologio): Santa Matilde de Hackeborn'
fuente: 'Texto bíblico: El Libro del Pueblo de Dios (traducción argentina, 1990), tal como lo publica la Santa Sede en vatican.va.'
imagen: /media/lecturas/2026-11-19.jpg
