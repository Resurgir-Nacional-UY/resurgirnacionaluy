fecha: '2026-11-13'
celebracion: Viernes de la XXXII semana del tiempo ordinario
santo: 'Memoria libre (santo del martirologio): San Estanislao de Kostka'
fuente: 'Texto bíblico: El Libro del Pueblo de Dios (traducción argentina, 1990), tal como lo publica la Santa Sede en vatican.va.'
imagen: /media/lecturas/2026-11-13.jpg
