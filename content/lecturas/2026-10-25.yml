# Lecturas de la Santa Misa del día. Un archivo por fecha (nombre = AAAA-MM-DD.yml).
# Se edita desde el CMS (Fe · Lecturas del día). `python scripts/render_lecturas.py`
# los junta en /lecturas.json, que lee la página Fe para mostrar la lectura de hoy.
fecha: '2026-10-25'
celebracion: XXX Domingo del tiempo ordinario
santo: ''
fuente: 'Texto bíblico: El Libro del Pueblo de Dios (traducción argentina, 1990), tal como lo publica la Santa Sede en vatican.va.'
draft: false
lecturas:
- tipo: Primera lectura
  cita: Éxodo 22, 20-26
  presentacion: Lectura del libro del Éxodo.
  texto: |-
    No maltratarás al extranjero ni lo oprimirás, porque ustedes fueron extranjeros en Egipto. No harás daño a la viuda ni al huérfano. Si les haces daño y ellos me piden auxilio, yo escucharé su clamor. Entonces arderá mi ira, y yo los mataré a ustedes con la espada; sus mujeres quedará viudas, y sus hijos huérfanos. Si prestas dinero a un miembro de mi pueblo, al pobre que vive a tu lado, no te comportarás con él como un usurero, no le exigirás interés.

    Si tomas en prenda el manto de tu prójimo, devuélveselo antes que se ponga el sol, porque ese es su único abrigo y el vestido de su cuerpo. De lo contrario, ¿con qué dormirá? Y si él me invoca, yo lo escucharé, porque soy compasivo.
  cierre: Palabra de Dios.
- tipo: Salmo responsorial
  cita: Salmo 18
  estrofas: |-
    Yo te amo, Señor, mi fuerza,
    Señor, mi Roca, mi fortaleza y mi libertador,

    mi Dios, el peñasco en que me refugio,
    mi escudo, mi fuerza salvadora, mi baluarte.
    Invoqué al Señor, que es digno de alabanza
    y quedé a salvo de mis enemigos.

    ¡Viva el Señor! ¡Bendita sea mi Roca!
    ¡Glorificado sea el Dios de mi salvación,
    El concede grandes victorias a su rey
    y trata con fidelidad a su Ungido.
- tipo: Segunda lectura
  cita: 1 Tesalonicenses 1, 5-10
  presentacion: Lectura de la primera carta del apóstol san Pablo a los Tesalonicenses.
  texto: |-
    Ya saben cómo procedimos cuando estuvimos allí al servicio de ustedes. Y ustedes, a su vez, imitaron nuestro ejemplo y el del Señor, recibiendo la Palabra en medio de muchas dificultades, con la alegría que da el Espíritu Santo. Así llegaron a ser un modelo para todos los creyentes de Macedonia y Acaya. En efecto, de allí partió la Palabra del Señor, que no sólo resonó en Macedonia y Acaya: en todas partes se ha difundido la fe que ustedes tienen en Dios, de manera que no es necesario hablar de esto.

    Ellos mismos cuentan cómo ustedes me han recibido y cómo se convirtieron a Dios, abandonando los ídolos para servir al Dios vivo y verdadero, y esperar a su Hijo, que vendrá desde el cielo: Jesús, a quien él resucitó y que nos libra de la ira venidera.
  cierre: Palabra de Dios.
- tipo: Evangelio
  cita: Mateo 22, 34-40
  presentacion: ✠ Lectura del santo Evangelio según san Mateo.
  texto: |-
    Cuando los fariseos se enteraron de que Jesús había hecho callar a los saduceos, se reunieron en ese lugar, y uno de ellos, que era doctor de la Ley, le preguntó para ponerlo a prueba: «Maestro, ¿cuál es el mandamiento más grande de la Ley?». Jesús le respondió: «Amarás al Señor, tu Dios, con todo tu corazón, con toda tu alma y con todo tu espíritu. Este es el más grande y el primer mandamiento.

    El segundo es semejante al primero: Amarás a tu prójimo como a ti mismo. De estos dos mandamientos dependen toda la Ley y los Profetas».
  cierre: Palabra del Señor.
