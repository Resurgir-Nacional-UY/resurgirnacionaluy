# Lecturas de la Santa Misa del día. Un archivo por fecha (nombre = AAAA-MM-DD.yml).
# Se edita desde el CMS (Fe · Lecturas del día). `python scripts/render_lecturas.py`
# los junta en /lecturas.json, que lee la página Fe para mostrar la lectura de hoy.
fecha: '2026-11-01'
celebracion: Solemnidad de Todos los Santos
santo: ''
fuente: 'Texto bíblico: El Libro del Pueblo de Dios (traducción argentina, 1990), tal como lo publica la Santa Sede en vatican.va.'
draft: false
lecturas:
- tipo: Primera lectura
  cita: Apocalipsis 7, 2-4. 9-14
  presentacion: Lectura del libro del Apocalipsis.
  texto: |-
    Luego vi a otro Angel que subía del Oriente, llevando el sello del Dios vivo. Y comenzó a gritar con voz potente a los cuatro Angeles que habían recibido el poder de dañar a la tierra y al mar: «No dañen a la tierra, ni al mar, ni a los árboles, hasta que marquemos con el sello la frente de los servidores de nuestro Dios». Oí entonces el número de los que habían sido marcados: eran 144.000 pertenecientes a todas las tribus de Israel.

    Después de esto, vi una enorme muchedumbre, imposible de contar, formada por gente de todas las naciones, familias, pueblos y lenguas. Estaban de pie ante el trono y delante del Cordero, vestidos con túnicas blancas; llevaban palmas en la mano y exclamaban con voz potente: «¡La salvación viene de nuestro Dios que está sentado en el trono, y del Cordero!». Y todos los Angeles que estaban alrededor del trono, de los Ancianos y de los cuatro Seres Vivientes, se postraron con el rostro en tierra delante del trono, y adoraron a Dios, diciendo: «¡Amén! ¡Alabanza, gloria y sabiduría, acción de gracias, honor, poder y fuerza a nuestro Dios para siempre! ¡Amén!

    Y uno de los Ancianos me preguntó: «¿Quiénes son y de dónde vienen los que están revestidos de túnicas blancas?». Yo le respondí: «Tú lo sabes, señor». Y él me dijo: «Estos son los que vienen de la gran tribulación; ellos han lavado sus vestiduras y las han blanqueado en la sangre del Cordero.
  cierre: Palabra de Dios.
- tipo: Salmo responsorial
  cita: Salmo 24
  estrofas: |-
    Del Señor es la tierra y todo lo que hay en ella,
    el mundo y todos sus habitantes
    porque él la fundó sobre los mares,
    él la afirmó sobre las corrientes del océano.

    ¿Quién podrá subir a la Montaña del Señor
    y permanecer en su recinto sagrado?
    El que tiene las manos limpias
    y puro el corazón;

    él recibirá la bendición del Señor,
    la recompensa de Dios, su Salvador.
    Así son los que buscan al Señor,
    los que buscan tu rostro, Dios de Jacob.
- tipo: Segunda lectura
  cita: 1 Juan 3, 1-3
  presentacion: Lectura de la primera carta del apóstol san Juan.
  texto: |-
    ¡Miren cómo nos amó el Padre! Quiso que nos llamáramos hijos de Dios, y nosotros lo somos realmente. Si el mundo no nos reconoce, es porque no lo ha reconocido a él. Queridos míos, desde ahora somos hijos de Dios, y lo que seremos no se ha manifestado todavía. Sabemos que cuando se manifieste, seremos semejantes a él, porque lo veremos tal cual es. El que tiene esta esperanza en él, se purifica, así como él es puro.
  cierre: Palabra de Dios.
- tipo: Evangelio
  cita: Mateo 5, 1-12
  presentacion: ✠ Lectura del santo Evangelio según san Mateo.
  texto: |-
    Al ver a la multitud, Jesús subió a la montaña, se sentó, y sus discípulos se acercaron a él. Entonces tomó la palabra y comenzó a enseñarles, diciendo: «Felices los que tienen alma de pobres, porque a ellos les pertenece el Reino de los Cielos. Felices los pacientes, porque recibirán la tierra en herencia. Felices los afligidos, porque serán consolados. Felices los que tienen hambre y sed de justicia, porque serán saciados.

    Felices los misericordiosos, porque obtendrán misericordia. Felices los que tienen el corazón puro, porque verán a Dios. Felices los que trabajan por la paz, porque serán llamados hijos de Dios. Felices los que son perseguidos por practicar la justicia, porque a ellos les pertenece el Reino de los Cielos. Felices ustedes, cuando sean insultados y perseguidos, y cuando se los calumnie en toda forma a causa de mí.

    Alégrense y regocíjense entonces, porque ustedes tendrán una gran recompensa en el cielo.
  cierre: Palabra del Señor.
