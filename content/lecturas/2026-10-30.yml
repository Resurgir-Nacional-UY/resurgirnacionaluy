# Lecturas de la Santa Misa del día. Un archivo por fecha (nombre = AAAA-MM-DD.yml).
# Se edita desde el CMS (Fe · Lecturas del día). `python scripts/render_lecturas.py`
# los junta en /lecturas.json, que lee la página Fe para mostrar la lectura de hoy.
fecha: '2026-10-30'
celebracion: Viernes de la XXX semana del tiempo ordinario
santo: 'Memoria libre (santo del martirologio): San Serapión'
fuente: 'Texto bíblico: El Libro del Pueblo de Dios (traducción argentina, 1990), tal como lo publica la Santa Sede en vatican.va.'
draft: false
lecturas:
- tipo: Primera lectura
  cita: Filipenses 1, 1-11
  presentacion: Lectura de la carta del apóstol san Pablo a los Filipenses.
  texto: |-
    Pablo y Timoteo, servidores de Cristo Jesús, saludan a todos los santos en Cristo Jesús, que se encuentran en Filipos, así como también a los que presiden la comunidad y a los diáconos. Llegue a ustedes la gracia y la paz que proceden de Dios, nuestro Padre, y del Señor Jesucristo. Yo doy gracias a Dios cada vez que los recuerdo. Siempre y en todas mis oraciones pido con alegría por todos ustedes, pensando en la colaboración que prestaron a la difusión del Evangelio, desde el comienzo hasta ahora.

    Estoy firmemente convencido de que aquel que comenzó en ustedes la buena obra la irá completando hasta el Día de Cristo Jesús. Y es justo que tenga estos sentimientos hacia todos ustedes, porque los llevo en mi corazón, ya que ustedes, sea cuando estoy prisionero, sea cuando trabajo en la defensa y en la confirmación del Evangelio, participan de la gracia que he recibido. Dios es testigo de que los quiero tiernamente a todos en el corazón de Cristo Jesús.

    Y en mi oración pido que el amor de ustedes crezca cada vez más en el conocimiento y en la plena comprensión, a fin de que puedan discernir lo que es mejor. Así serán encontrados puros e irreprochables en el Día de Cristo. llenos del fruto de justicia que proviene de Jesucristo, para la gloria y alabanza de Dios.
  cierre: Palabra de Dios.
- tipo: Salmo responsorial
  cita: Salmo 111
  estrofas: |-
    Doy gracias al Señor de todo corazón,
    en la reunión y en la asamblea de los justos.
    Grandes son las obras del Señor:
    los que las aman desean comprenderlas.

    Su obra es esplendor y majestad,
    su justicia permanece para siempre.
    El hizo portentos memorables,
    el Señor es bondadoso y compasivo.

    Proveyó de alimento a sus fieles
    y se acuerda eternamente de su alianza.
    Manifestó a su pueblo el poder de sus obras,
    dándole la herencia de las naciones.
- tipo: Evangelio
  cita: Lucas 14, 1-6
  presentacion: ✠ Lectura del santo Evangelio según san Lucas.
  texto: |-
    Un sábado, Jesús entró a comer en casa de uno de los principales fariseos. Ellos lo observaban atentamente. Delante de él había un hombre enfermo de hidropesía. Jesús preguntó a los doctores de la Ley y a los fariseos: «¿Está permitido curar en sábado o no?». Pero ellos guardaron silencio. Entonces Jesús tomó de la mano al enfermo, lo curó y lo despidió. Y volviéndose hacia ellos, les dijo: «Si a alguno de ustedes se le cae en un pozo su hijo o su buey, ¿acaso no lo saca en seguida, aunque sea sábado?».

    A esto no pudieron responder nada.
  cierre: Palabra del Señor.
