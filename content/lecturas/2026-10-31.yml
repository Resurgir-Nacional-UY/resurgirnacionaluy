# Lecturas de la Santa Misa del día. Un archivo por fecha (nombre = AAAA-MM-DD.yml).
# Se edita desde el CMS (Fe · Lecturas del día). `python scripts/render_lecturas.py`
# los junta en /lecturas.json, que lee la página Fe para mostrar la lectura de hoy.
fecha: '2026-10-31'
celebracion: Sábado de la XXX semana del tiempo ordinario
santo: 'Memoria libre: Santa María en sábado'
fuente: 'Texto bíblico: El Libro del Pueblo de Dios (traducción argentina, 1990), tal como lo publica la Santa Sede en vatican.va.'
draft: false
lecturas:
- tipo: Primera lectura
  cita: Filipenses 1, 18-26
  presentacion: Lectura de la carta del apóstol san Pablo a los Filipenses.
  texto: |-
    Y de esto me alegro y me alegraré siempre. Porque sé que esto servirá para mi salvación, gracias a las oraciones de ustedes y a la ayuda que me da el Espíritu de Jesucristo. Así lo espero ansiosamente, y no seré defraudado. Al contrario, estoy completamente seguro de que ahora, como siempre, sea que viva, sea que muera, Cristo será glorificado en mi cuerpo. Porque para mí la vida es Cristo, y la muerte, una ganancia.

    Pero si la vida en este cuerpo me permite seguir trabajando fructuosamente, ya no sé qué elegir. Me siento urgido de ambas partes: deseo irme para estar con Cristo, porque es mucho mejor, pero por el bien de ustedes es preferible que permanezca en este cuerpo. Tengo la plena convicción de que me quedaré y permaneceré junto a todos ustedes, para que progresen y se alegren en la fe.

    De este modo, mi regreso y mi presencia entre ustedes les proporcionarán un nuevo motivo de orgullo en Cristo Jesús.
  cierre: Palabra de Dios.
- tipo: Salmo responsorial
  cita: Salmo 42
  estrofas: |-
    Como la cierva sedienta
    busca las corrientes de agua,
    así mi alma suspira
    por ti, mi Dios.

    Mi alma tiene sed de Dios,
    del Dios viviente:
    ¿Cuándo iré a contemplar
    el rostro de Dios?

    ¡cómo iba en medio de la multitud
    y la guiaba hacia la Casa de Dios,
    entre cantos de alegría y alabanza,
    en el júbilo de la fiesta!
- tipo: Evangelio
  cita: Lucas 14, 1. 7-11
  presentacion: ✠ Lectura del santo Evangelio según san Lucas.
  texto: |-
    Un sábado, Jesús entró a comer en casa de uno de los principales fariseos. Ellos lo observaban atentamente. Y al notar cómo los invitados buscaban los primeros puestos, les dijo esta parábola: «Si te invitan a un banquete de bodas, no te coloques en el primer lugar, porque puede suceder que haya sido invitada otra persona más importante que tú, y cuando llegue el que los invitó a los dos, tenga que decirte: "Déjale el sitio", y así, lleno de vergüenza, tengas que ponerte en el último lugar.

    Al contrario, cuando te inviten, ve a colocarte en el último sitio, de manera que cuando llegue el que te invitó, te diga: "Amigo, acércate más", y así quedarás bien delante de todos los invitados. Porque todo el que ensalza será humillado, y el que se humilla será ensalzado».
  cierre: Palabra del Señor.
