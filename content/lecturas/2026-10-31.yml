# Lecturas de la Santa Misa del día. Un archivo por fecha (nombre = AAAA-MM-DD.yml).
# Se edita desde el CMS (Fe · Lecturas del día). `python scripts/render_lecturas.py`
# los junta en /lecturas.json, que lee la página Fe para mostrar la lectura de hoy.
fecha: '2026-10-31'
celebracion: Sábado de la XXX semana del tiempo ordinario
santo: 'Memoria libre: Santa María en sábado'
fuente: 'Texto bíblico: La Sagrada Biblia, traducción de Mons. Juan Straubinger.'
draft: false
lecturas:
- tipo: Primera lectura
  cita: Filipenses 1, 18-26
  presentacion: Lectura de la carta del apóstol san Pablo a los Filipenses.
  texto: |-
    En esto me regocijo y no dejaré de regocijarme. Porque sé que esto resultará en mi provecho gracias a vuestra oración y a la asistencia del Espíritu de Jesucristo, según mi firme expectación y esperanza de que en nada seré confundido; sino que, con toda libertad, ahora lo mismo que siempre, Cristo será enaltecido en mi cuerpo, sea por vida, o por muerte.

    Porque para mí el vivir es Cristo, y el morir ganancia. Mas si el vivir en la carne significa para mí trabajo fecundo, no sé qué escoger. Estrechado estoy por ambos lados: tengo deseo de morir y estar con Cristo, lo cual sería mucho mejor; por otra parte el quedarme en la carne es más necesario por vosotros.

    Persuadido, pues, de esto ya sé que me quedaré y permaneceré para todos vosotros, para vuestro provecho gozo en la fe, a fin de que abunde vuestra gloria en Cristo Jesús, a causa mía, con motivo de mi reaparición entre vosotros.
  cierre: Palabra de Dios.
- tipo: Salmo responsorial
  cita: Salmo 41
  estrofas: |-
    Como el ciervo ansía
    las corrientes de aguas,
    así mi alma suspira por Ti, oh Dios.

    Porque mi alma tiene sed de Dios,
    del Dios vivo.
    ¿Cuándo vendré
    y estaré en la presencia de Dios?

    De cómo caminaba yo
    al frente de la noble cohorte
    hacia la casa de Dios,
    entre cantares de júbilo y alabanza,
    en festivo cortejo.
- tipo: Evangelio
  cita: Lucas 14, 1. 7-11
  presentacion: ✠ Lectura del santo Evangelio según san Lucas.
  texto: |-
    Como Él hubiese ido a casa de un jefe de los fariseos, un día sabático a comer, ellos lo acechaban. Observando cómo elegían los primeros puestos en la mesa, dirigió una parábola a los invitados, diciéndoles: “Cuando seas invitado a un convite de bodas, no te pongas en el primer puesto, no sea que haya allí otro convidado objeto de mayor honra que tú y viniendo el que os convido a ambos, te diga: “Deja el sitio a éste”, y pases entonces, con vergüenza, a ocupar el último lugar. Por el contrario, cuando seas invitado, ve a ponerte en el último lugar, para que, cuando entre el que te invitó, te diga: “Amigo, sube más arriba”.

    Y entonces tendrás honor a los ojos de todos los convidados. Porque el que se levanta, será abajado; y el que se abaja, será levantado”.
  cierre: Palabra del Señor.
