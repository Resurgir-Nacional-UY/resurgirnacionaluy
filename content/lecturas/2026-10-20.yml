# Lecturas de la Santa Misa del día. Un archivo por fecha (nombre = AAAA-MM-DD.yml).
# Se edita desde el CMS (Fe · Lecturas del día). `python scripts/render_lecturas.py`
# los junta en /lecturas.json, que lee la página Fe para mostrar la lectura de hoy.
fecha: '2026-10-20'
celebracion: Martes de la XXIX semana del tiempo ordinario
santo: ''
fuente: 'Texto bíblico: La Sagrada Biblia, traducción de Mons. Juan Straubinger.'
draft: false
lecturas:
- tipo: Primera lectura
  cita: Efesios 2, 12-22
  presentacion: Lectura de la carta del apóstol san Pablo a los Efesios.
  texto: |-
    (acordaos digo) de que entonces estabais separados de Cristo, extraños a la comunidad de Israel, y ajenos a los pactos de la promesa, sin esperanza y sin Dios en el mundo. Mas ahora, en Cristo Jesús, vosotros los que en un tiempo estabais lejos, habéis sido acercados por la sangre de Cristo.

    Porque Él es nuestra paz: El que de ambos hizo uno, derribando de en medio el muro de separación, la enemistad; anulando por medio de su carne la Ley con sus mandamientos y preceptos, para crear en Sí mismo de los dos un solo hombre nuevo, haciendo paz, y para reconciliar con Dios a ambos en un solo cuerpo por medio de la Cruz, matando en ella la enemistad.

    Y viniendo, evangelizó paz a vosotros los que estabais lejos, y paz a los de cerca. Y así por Él unos y otros tenemos el acceso al Padre, en un mismo Espíritu; de modo que ya no sois extranjeros ni advenedizos sino que sois conciudadanos de los santos y miembros de la familia de Dios, edificados sobre el fundamento de los apóstoles y profetas, siendo piedra angular el mismo Cristo Jesús, en quien todo el edificio, armónicamente trabado, crece para templo santo en el Señor.

    En Él sois también vosotros coedificados en el Espíritu para morada de Dios.
  cierre: Palabra de Dios.
- tipo: Salmo responsorial
  cita: Salmo 84
  estrofas: |-
    Quiero escuchar
    lo que dirá Yahvé mi Dios;
    sus palabras serán de paz
    para su pueblo y para sus santos.
    Sí, cercana está su salvación
    para los que le temen;
    y la Gloria fijará su morada en nuestro país.

    La misericordia y la fidelidad
    se saldrán al encuentro;
    se darán el ósculo la justicia y la paz.
    La fidelidad germinará de la tierra
    y la justicia se asomará desde el cielo.

    El mismo Yahvé dará el bien
    y nuestra tierra dará su fruto.
    La justicia marchará ante Él
    y la salud sobre la huella de sus pasos.
- tipo: Evangelio
  cita: Lucas 12, 35-38
  presentacion: ✠ Lectura del santo Evangelio según san Lucas.
  texto: |-
    “Estén ceñidos vuestros lomos, y vuestras lámparas encendidas. Y sed semejantes a hombres que aguardan a su amo a su regreso de las bodas, a fin de que, cuando Él llegue y golpee, le abran en seguida. ¡Felices esos servidores, que el amo, cuando llegue, hallará velando! En verdad, os lo digo, él se ceñirá, los hará sentar a la mesa y se pondrá a servirles. Y si llega a la segunda vela, o a la tercera, y así los hallare, ¡felices de ellos!
  cierre: Palabra del Señor.
