# Lecturas de la Santa Misa del día. Un archivo por fecha (nombre = AAAA-MM-DD.yml).
# Se edita desde el CMS (Fe · Lecturas del día). `python scripts/render_lecturas.py`
# los junta en /lecturas.json, que lee la página Fe para mostrar la lectura de hoy.
fecha: '2026-10-20'
celebracion: Martes de la XXIX semana del tiempo ordinario
santo: 'Memoria libre (santo del martirologio): San Juan Cancio'
fuente: 'Texto bíblico: El Libro del Pueblo de Dios (traducción argentina, 1990), tal como lo publica la Santa Sede en vatican.va.'
draft: false
lecturas:
- tipo: Primera lectura
  cita: Efesios 2, 12-22
  presentacion: Lectura de la carta del apóstol san Pablo a los Efesios.
  texto: |-
    Entonces ustedes no tenían a Cristo y estaban excluidos de la comunidad de Israel, ajenos a las alianzas de la promesa, sin esperanza y sin Dios en el mundo. Pero ahora, en Cristo Jesús, ustedes, los que antes estaban lejos, han sido acercados por la sangre de Cristo. Porque Cristo es nuestra paz; él ha unido a los dos pueblos en uno solo, derribando el muro de enemistad que los separaba, y aboliendo en su propia carne la Ley con sus mandamientos y prescripciones. Así creó con los dos pueblos un solo Hombre nuevo en su propia persona, restableciendo la paz, y los reconcilió con Dios en un solo Cuerpo, por medio de la cruz, destruyendo la enemistad en su persona.

    Y él vino a proclamar la Buena Noticia de la paz, paz para ustedes, que estaban lejos, paz también para aquellos que estaban cerca. Porque por medio de Cristo, todos sin distinción tenemos acceso al Padre, en un mismo Espíritu. Por lo tanto, ustedes ya no son extranjeros ni huéspedes, sino conciudadanos de los santos y miembros de la familia de Dios. Ustedes están edificados sobre los apóstoles y los profetas, que son los cimientos, mientras que la piedra angular es el mismo Jesucristo.

    En él, todo el edificio, bien trabado, va creciendo para constituir un templo santo en el Señor. En él, también ustedes son incorporados al edificio, para llegar a ser una morada de Dios en el Espíritu.
  cierre: Palabra de Dios.
- tipo: Salmo responsorial
  cita: Salmo 85
  estrofas: |-
    Voy a proclamar lo que dice el Señor:
    el Señor promete la paz,
    la paz para su pueblo y sus amigos,
    Su salvación está muy cerca de sus fieles,
    y la Gloria habitará en nuestra tierra.

    El Amor y la Verdad se encontrarán,
    la Justicia y la Paz se abrazarán;
    la Verdad brotará de la tierra
    y la Justicia mirará desde el cielo.

    El mismo Señor nos dará sus bienes
    y nuestra tierra producirá sus frutos.
    La Justicia irá delante de él,
    y la Paz, sobre la huella de sus pasos.
- tipo: Evangelio
  cita: Lucas 12, 35-38
  presentacion: ✠ Lectura del santo Evangelio según san Lucas.
  texto: |-
    Estén preparados, ceñidos y con las lámparas encendidas. Sean como los hombres que esperan el regreso de su señor, que fue a una boda, para abrirle apenas llegue y llame a la puerta. ¡Felices los servidores a quienes el señor encuentra velando a su llegada! Les aseguro que él mismo recogerá su túnica, los hará sentar a la mesa y se pondrá a servirlo. ¡Felices ellos, si el señor llega a medianoche o antes del alba y los encuentra así!
  cierre: Palabra del Señor.
