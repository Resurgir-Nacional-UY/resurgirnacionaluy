# Desglose de financiamiento. Lo lee scripts/render_financiamiento.py y
# genera financiamiento.html. Editable desde el CMS: "Financiamiento".
#
# Mientras no haya períodos ni eventos cargados, la página muestra un texto
# genérico ("Próximamente") sin números.
ejemplo: false
lead: "En qué se usa cada peso que recibe el movimiento. Publicamos los ingresos y los gastos de cada período."
moneda: "$"
# Colectas para una ocasión puntual, con su propia meta. Las que tienen
# `cerrado: true` pasan a "Colectas anteriores". En cada donación, el nombre
# es opcional: si se deja vacío aparece como "Anónimo". Este archivo es
# PUBLICO en GitHub, así que de un donante anónimo no se guarda el nombre.
eventos: []
periodos: []
