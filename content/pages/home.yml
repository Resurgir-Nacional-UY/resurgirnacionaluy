ideario_label: "Visión"
ideario_heading: "Dios, Patria y Familia"
ideario_intro: "Resurgir Nacional busca la regeneración, espiritual, cultural, social y política del Uruguay desde una Tercera Posición: fuera de la vieja disputa de izquierdas y derechas y del dogma democrático liberal. Estos son los valores que nos guían."
ideario_values:
  - title: "Orgullo Nacional"
    body: "Un Uruguay soberano que protege su identidad y su historia."
  - title: "Valores Cristianos"
    body: "La fe cristiana como guía para vivir con justicia y dignidad."
  - title: "Familia, pilar de la Nación"
    body: "Núcleo de la sociedad y base de un futuro próspero."
  - title: "Salud y fortaleza física"
    body: "Vida sana, alimentación natural y vigor espiritual."
  - title: "Defensa de la tierra"
    body: "Ganadería tradicional y soberanía alimentaria."
  - title: "Resistencia al globalismo"
    body: "Frente a la ideología de género y la descomposición cultural."
  - title: "Unidad y solidaridad nacional"
    body: "Comunidad y colaboración por un Uruguay unido."
  - title: "Disciplina"
    body: "Trabajo con perseverancia y determinación."
  - title: "Preservación cultural"
    body: "Defensa del legado y las tradiciones nacionales."
  - title: "Anti-liberalismo"
    body: "Todo orden político subordinado a un orden superior."
  - title: "Anti-marxismo"
    body: "Frente al materialismo, una concepción espiritual del mundo."
  - title: "Anti-democratismo liberal"
    body: "La raíz del mal está en el sistema político imperante."

aporta_label: "Colaborar"
aporta_heading: "El movimiento se sostiene con la cuota de sus miembros."
aporta_tiers:
  - name: "Cuota general"
    amount: "$ 70/mes"
    use: "Mínimo mensual por miembro."
  - name: "Estudiantes y padres"
    amount: "$ 50/mes"
    use: "Cuota reducida."
  - name: "Situación particular"
    amount: "Flexible"
    use: "No pagar la cuota no impide el ingreso ni es motivo de expulsión; el integrante debe aclarar su situación antes de ingresar."
aporta_note: "El dinero recaudado se destina a las actividades de Resurgir Nacional: propaganda callejera (afiches, pegatinas, carteleras, banderas), acciones sociales y funcionamiento del movimiento."
aporta_paypal: "https://www.paypal.me/resurgirnacional"
aporta_kofi: "https://ko-fi.com/resurgirnacionaluy"

sumate_label: "Sumarse"
sumate_heading: "Cómo ingresar a Resurgir Nacional"
sumate_p1: "Para ingresar es necesario pasar por una entrevista virtual (Google Meet, Jitsi, Zoom o Discord) con una serie de preguntas de índole política, religiosa y cultural."
sumate_p2: "Cristianos de otras denominaciones, ateos y agnósticos pueden unirse y participar siempre que respeten la base religiosa del movimiento."
sumate_contact_label: "Escríbenos a nuestro correo electrónico:"

contact_email: "resurgirnacionaluruguay@gmail.com"
