hero_video: hero.mp4

sec1_heading: "Una regeneración política, cultural y social"
sec1_p1: "Buscamos la regeneración política, cultural y social del Uruguay, trabajando fuera del sistema de partidos y del dogma democrático. Para ello trabajamos en ser la voz y la acción que defiende el corazón de Uruguay: su gente, su fe, su tierra y sus tradiciones. Promovemos un nacionalismo virtuoso y los valores cristianos como la guía para un futuro digno y soberano. Queremos un país fuerte, donde Dios, la Patria y la Familia vuelvan a ser la base de la sociedad."
sec1_pullquote: "Queremos un país fuerte, donde Dios, la Patria y la Familia vuelvan a ser la base de la sociedad."
sec1_p2: "Nos oponemos a las divisiones desgastadas de la lucha política de derechas e izquierdas. Nuestra Tercera Posición en Uruguay debe enfocarse en romper con el orden liberal, partidocrático y masónico que nos ha acompañado a lo largo de la historia. Y es acá donde se encuentra el enfoque principal del movimiento: la construcción de un orden nuevo, porque se ha llegado al punto en el cual las instituciones no son simplemente pervertidas, sino que son incapaces de generar algo diminutamente positivo como por lo menos solían hacer."
sec1_p3: "El orden actual de las cosas, tanto social como política y económicamente, no soportará mucho más. Es cuestión de tiempo para que el país colapse, y la razón de ello es que, en vez de destinar esfuerzos en la construcción de un proyecto nacional, se ha seguido con la lucha partidocrática; se ha mantenido la discusión política en aquella falsa y dañina polarización de izquierdas y derechas que limita el debate político y manipula a la gente desesperada. En los últimos cuarenta años se ha visto una destrucción promovida desde la democracia liberal de nuestra economía, nuestra educación, nuestra seguridad y nuestra sociedad entera: de los pilares básicos de cualquier país. En definitiva se destruye, no por causas foráneas sino cercanas, la totalidad de la nación."
sec1_p4: "¿Cuál es la situación nacional tras tantos años de palabrería democrática y liberal? La educación arruinada, la industria nacional destruida hasta casi su inexistencia, nuestra cultura convertida en un espectáculo babilónico, la partidocracia cada vez más dañina, los suicidios aumentando cada año, el empleo que ya no es sinónimo de estabilidad, la riqueza natural de nuestros suelos y ríos robada por agentes internacionales sin patria, la usura y la deuda que esclavizan a cada hombre y mujer. La natalidad cae en picada. Nuestro capital humano desaparece."

sec2_heading: "Un Uruguay sano, virtuoso y unido"
sec2_p1: "Resurgir Nacional sueña con un Uruguay sano, virtuoso y unido, donde cada ciudadano se sienta orgulloso de su identidad y de su patria. Un país que honra su verdadero legado cultural y que avanza hacia un futuro donde la familia, la fe y el trabajo sean sinónimos de esperanza y grandeza. Queremos ser un ejemplo de fortaleza y determinación, encendiendo la chispa del renacimiento cristiano y nacionalista en cada rincón de nuestra tierra."
sec2_p2: "Buscamos, en definitiva, lo que ha hecho grande a los pueblos. Para ello, Resurgir Nacional decide seguir los siguientes valores."

sec3_heading: "Doce principios"
sec3_values:
  - title: "Orgullo Nacional"
    body: "Creemos en un Uruguay soberano, fuerte y decidido a proteger su identidad y su historia."
  - title: "Valores Cristianos"
    body: "Nos guiamos por la luz de los valores cristianos, que nos inspiran a vivir con justicia y dignidad."
  - title: "Familia, pilar de la Nación"
    body: "Defendemos la familia como el núcleo de nuestra sociedad y la base de un futuro próspero."
  - title: "Salud y fortaleza física"
    body: "Promovemos una vida sana, con alimentación natural, fuerza física y vigor espiritual como cimientos de un pueblo invencible."
  - title: "Defensa de la tierra"
    body: "Nuestra riqueza está en la tierra: es con ella donde nacen nuestras industrias madres. Protegemos la ganadería tradicional como símbolo de nuestra cultura y sustento de nuestra soberanía alimentaria."
  - title: "Resistencia al globalismo"
    body: "Nos oponemos al globalismo, a la ideología de género y a la cultura degenerada que promueve la hipersexualización, la apología a la delincuencia y la descomposición moral, defendiendo nuestras tradiciones y valores nacionales."
  - title: "Unidad y solidaridad nacional"
    body: "Creemos en el poder de la comunidad y en la colaboración para construir un Uruguay unido y solidario."
  - title: "Disciplina"
    body: "Trabajamos con inteligencia, perseverancia y determinación, con voluntad, buscando gente que quiera aportar de verdad a Resurgir Nacional, siguiendo el ejemplo de quienes han sabido defender sus ideales."
  - title: "Preservación cultural"
    body: "Resistimos con orgullo cualquier intento de borrar nuestras tradiciones y buscamos fortalecer el legado de nuestra identidad nacional."
  - title: "Anti-liberalismo"
    body: "Nuestro movimiento condena y condenará siempre al liberalismo que provoca decadencia y enajenación a nuestra patria. Todo orden político debe estar subordinado a un orden superior, a Dios. El liberalismo destruye todos los sanos valores que buscamos preservar y fortalecer."
  - title: "Anti-marxismo"
    body: "Nuestro movimiento condena y condenará al marxismo y su materialismo, profundamente dañinos para la prosperidad del Uruguay. El marxismo atenta contra nuestra fe y nuestra forma de ver el mundo, que es una concepción espiritual y trascendental."
  - title: "Anti-democratismo liberal"
    body: "Nuestro movimiento ve claramente que el mal que padece nuestra patria se encuentra de raíz en el sistema político imperante. No hay futuro, desarrollo, prosperidad ni proyecto nacional posible con este sistema. La necesidad de un orden político auténtico y orgánico, subordinado al orden superior de la fe, es hoy más necesaria que nunca."

sec4_heading: "Un espacio cultural, social y estratégico apartidario"
sec4_p1: "Nuestra misión actual es crear un espacio cultural, social y estratégico apartidario. El objetivo ahora es ser un lugar de reflexión, militancia y planificación."
sec4_p2: "Para sostener la estructura interna del movimiento se establece una cuota mensual de cada miembro de mínimo 70 pesos, y de 50 pesos para estudiantes o padres. El dinero recaudado se destina a las actividades de RN. La cuota es flexible según la situación económica de cada integrante: no pagarla no es motivo de expulsión ni impide el acceso al movimiento, pero el integrante debe aclarar su situación antes de ingresar."
sec4_p3: "Para ingresar a Resurgir Nacional es necesario pasar por una entrevista virtual (Google Meet, Jitsi, Zoom o Discord) con una serie de preguntas de índole política, religiosa y cultural."
sec4_facts:
  - big: "$ 70/mes"
    label: "Cuota general (mínimo)"
  - big: "$ 50/mes"
    label: "Estudiantes y padres"
  - big: "Entrevista"
    label: "Ingreso previa entrevista virtual"

sec5_heading: "Cómo trabajamos"
sec5_acts:
  - title: "Debates"
    body: "Debates sobre temas políticos, sociales, económicos y culturales. Un espacio para discutir sin presiones externas, con análisis profundo."
  - title: "Propaganda"
    body: "Jornadas de propaganda callejera con consignas ligadas a las problemáticas del país. Parte de lo recaudado por la cuota se destina a afiches, pegatinas, carteleras, grafitis, banderas y demás."
  - title: "Acciones sociales"
    body: "Trabajos de carácter social sin ánimo de lucro: donaciones de ropa y alimento a iglesias, hospitales, policlínicas, zonas periféricas, orfanatos, familias necesitadas, personas sin techo y personas con discapacidad. Se destina parte de la cuota cuando es necesario."
  - title: "Redes sociales"
    body: "Las redes y los medios modernos son fundamentales en la batalla cultural. Usamos TikTok, YouTube, Twitter, Instagram y Telegram para difundir públicamente nuestra visión y nuestro trabajo."
  - title: "Trabajo intelectual"
    body: "El trabajo intelectual enriquece al movimiento y a la Tercera Posición. Difundimos textos de diversas temáticas, presentaciones, podcasts sobre actualidad, historia, política y filosofía, y entrevistas a personas de interés."
  - title: "Ejercicio espiritual"
    body: "Resurgir Nacional tiene una base fuertemente católica. Compartimos invitaciones a misas y rosarios e incentivamos a asistir en grupo a las actividades católicas para cultivar la fe en comunidad. Cristianos de otras denominaciones, ateos y agnósticos pueden unirse y participar siempre que respeten la base religiosa del movimiento."
  - title: "Afiliación política"
    body: "Votantes de CA, FA, PC, PN, IS y demás partidos pueden formar parte del movimiento. Se pide mantener separadas la pertenencia a Resurgir Nacional y la militancia partidaria individual."
