sec1_lead: "Consagración del Uruguay · Beato Jacinto Vera"
sec1_p1: "El 3 de junio de 1875, el Beato Jacinto Vera consagró solemnemente el Uruguay al Sagrado Corazón de Jesús."

sec2_heading: "Corazón de Jesús"
sec2_p1: "Tú eres nuestro consuelo y nuestra esperanza."
sec2_p2: "Humildemente postrados en tu presencia, te pedimos perdón de nuestros pecados."
sec2_p3: "Proclamamos que queremos vivir y morir en tu servicio y corresponder dignamente a tus soberanos designios de misericordia en favor de la Iglesia y de la sociedad."
sec2_p4: "Te consagramos nuestras personas y nuestras familias, nuestros intereses y nuestros bienes, el presente y el porvenir."
sec2_p5: "Te rogamos, Señor, acojas benignamente nuestras plegarias por tu Santa Iglesia, por la conversión y salvación de los hombres, por la paz y prosperidad de nuestra patria y de todos los pueblos."
sec2_p6: "Amén."
sec2_invocations: "¡Corazón Santísimo, sálvanos!\n¡Corazón de Jesús, ten piedad de nosotros!"

sec3_heading: "Oración para todos los días"
sec3_p1: "Santísima Virgen de los Treinta y Tres, ante cuya imagen inclinaron su bandera y doblaron reverentemente su rodilla los fundadores de nuestra Patria."
sec3_p2: "Protege siempre a este pueblo nacido a tu sombra bienhechora."
sec3_p3: "Concede, oh Virgen de los Treinta y Tres, que en nuestros hogares florezcan la religión y todas las virtudes cristianas."
sec3_p4: "Haz que veamos el reinado de Cristo, que es el de la verdad y la justicia."
sec3_p5: "Alcánzanos estas gracias y la de la eterna salvación, de tu Hijo Jesucristo, que con el Padre y el Espíritu Santo vive y reina por los siglos de los siglos. Amén."

sec4_heading: "Oración al Beato Jacinto Vera"
sec4_p1: "Dios, Padre nuestro, que ungiste con el Espíritu Santo a tu Siervo Jacinto, eligiéndolo como primer Obispo del Uruguay, para que, como instrumento de Cristo, Buen Pastor, llevara a todos los rincones de nuestra Patria el Evangelio de Tu Amor y los Sacramentos de la Salvación:"
sec4_p2: "Guía a nuestros obispos y sacerdotes. Envía abundantes y santas vocaciones sacerdotales y religiosas. Une a nuestras familias en la verdad y en el amor. Otorga a tus fieles santidad de vida y fortaleza para ser testigos del Evangelio de Cristo."
sec4_p3: "Haz que vivamos según tus mandamientos, caminando bajo la luz de la fe, con la esperanza puesta en Ti, amándote con todo el corazón y amando al prójimo por amor a Ti."
sec4_p4: "Glorifica tu Nombre en tu Siervo Jacinto y concédele ser reconocido entre tus santos, para alabanza de tu gloria y edificación de tu Iglesia."
sec4_p5: "Dame, Señor, por su intercesión, la gracia que humilde y devotamente te pido (breve silencio para que cada uno pida la gracia deseada) y ayúdame a conformar mi vida con tu voluntad."
sec4_p6: "Por Jesucristo, nuestro Señor. Amén."
