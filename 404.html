<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src 'none'" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Página no encontrada — Resurgir Nacional</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" />
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 130% at 50% 0%, #24579C 0%, #1B3F73 45%, #14315C 100%);
    color: #F4F2EA; font-family: "Fraunces", Georgia, serif; text-align: center; padding: 2rem;
  }
  .box { max-width: 34rem; }
  .kicker { font-family: "Archivo", system-ui, sans-serif; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; font-size: 0.72rem; color: #E7C978; }
  h1 { font-weight: 600; font-size: clamp(1.8rem, 1.4rem + 2vw, 2.8rem); margin: 1rem 0 0.6rem; }
  p { color: #E7E3D6; font-size: 1.05rem; line-height: 1.6; margin: 0 0 1.8rem; }
  .links { display: flex; gap: 0.8rem 1.6rem; flex-wrap: wrap; justify-content: center; font-family: "Archivo", sans-serif; font-weight: 600; font-size: 0.82rem; letter-spacing: 0.1em; text-transform: uppercase; }
  .links a { color: #F4F2EA; text-decoration: none; border-bottom: 2px solid #C6A24C; padding-bottom: 2px; }
  .links a:hover { color: #fff; }
  .live-banner { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 10; background: #14315C; border-bottom: 1px solid rgba(255,255,255,0.2); }
  .live-banner.is-on { display: block; }
  .live-banner.is-live { background: #B3261E; }
  .live-banner__row { display: flex; flex-wrap: wrap; max-width: 1120px; margin-inline: auto; }
  .live-banner__link { flex: 1 1 320px; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 0.6rem; padding: 0.55rem 1rem; color: #fff; text-decoration: none; font-family: "Archivo", sans-serif; font-size: 0.85rem; flex-wrap: wrap; }
  .live-banner__link + .live-banner__link { border-left: 1px solid rgba(255,255,255,0.22); }
  .live-banner__link--live { background: #B3261E; }
  .live-banner__link:hover { opacity: 0.88; }
  .live-banner__dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; flex: none; }
  .live-banner__label { font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .live-banner__title { opacity: 0.92; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40ch; min-width: 0; }
  .live-banner__cta { font-weight: 600; text-decoration: underline; white-space: nowrap; }
  @media (max-width: 700px) {
    .live-banner__link + .live-banner__link { border-left: 0; border-top: 1px solid rgba(255,255,255,0.22); }
  }
</style>
</head>
<body>
  <div class="live-banner" id="live-banner">
    <div class="live-banner__row" id="live-banner-row"></div>
  </div>
  <script>
    /* Barra de YouTube (lee /live-status.json):
       - en vivo ahora (rojo);
       - directo terminado hace menos de 6 h;
       - directo programado ("Próximo directo"), y con él también el último directo ya hecho,
         aunque tenga más de 6 h: así quedan los dos enlaces. */
    (function () {
      var b = document.getElementById('live-banner');
      var row = document.getElementById('live-banner-row');
      if (!b || !row) return;
      var TZ = 'America/Montevideo';
      function dia(ms) { return new Intl.DateTimeFormat('en-CA', { timeZone: TZ }).format(ms); }
      function cuando(ms) {
        var hora = new Intl.DateTimeFormat('es-UY', { timeZone: TZ, hour: '2-digit', minute: '2-digit' }).format(ms);
        var hoy = dia(Date.now()), d = dia(ms);
        if (d === hoy) return 'hoy, ' + hora;
        if (d === dia(Date.now() + 864e5)) return 'mañana, ' + hora;
        return new Intl.DateTimeFormat('es-UY', { timeZone: TZ, weekday: 'short', day: 'numeric', month: 'short' }).format(ms) + ', ' + hora;
      }
      function fecha(ms) { return new Intl.DateTimeFormat('es-UY', { timeZone: TZ, day: 'numeric', month: 'short' }).format(ms); }
      function enlace(tipo, url, etiqueta, titulo, cta) {
        var a = document.createElement('a');
        a.className = 'live-banner__link live-banner__link--' + tipo;
        a.href = url; a.target = '_blank'; a.rel = 'noopener';
        if (tipo === 'live') { var dot = document.createElement('span'); dot.className = 'live-banner__dot'; dot.setAttribute('aria-hidden', 'true'); a.appendChild(dot); }
        [['live-banner__label', etiqueta], ['live-banner__title', titulo ? '— ' + titulo : ''], ['live-banner__cta', cta]].forEach(function (p) {
          if (!p[1]) return;
          var s = document.createElement('span'); s.className = p[0]; s.textContent = p[1]; a.appendChild(s);
        });
        row.appendChild(a);
      }
      fetch('/live-status.json', { cache: 'no-store' }).then(function (r) {
        return r.ok ? r.json() : null;
      }).then(function (d) {
        if (!d) return;
        var ahora = Date.now();
        var prox = d.upcoming && d.upcoming.url ? d.upcoming : null;
        var inicio = prox ? Date.parse(prox.start) : NaN;
        if (prox && (isNaN(inicio) || ahora - inicio > 2 * 3600 * 1000)) prox = null;  // nunca arrancó
        var mostrado = null;
        if (d.live && d.url) {
          enlace('live', d.url, 'Estamos en vivo ahora', d.title, 'Ver en YouTube →');
          b.classList.add('is-live');
          mostrado = d.videoId;
        } else {
          var fin = d.endedAt ? Date.parse(d.endedAt) : NaN;
          var ms = ahora - fin;
          if (d.url && !isNaN(fin) && ms <= 6 * 3600 * 1000) {
            var min = Math.max(1, Math.round(ms / 60000));
            enlace('recent', d.url, 'Directo finalizado · hace ' + (min < 60 ? min + ' min' : Math.round(min / 60) + ' h'), d.title, 'Ver grabación →');
            mostrado = d.videoId;
          } else if (prox && d.last && d.last.url) {
            enlace('recent', d.last.url, 'Último directo · ' + fecha(Date.parse(d.last.endedAt)), d.last.title, 'Ver grabación →');
            mostrado = d.last.videoId;
          }
        }
        if (prox && prox.videoId !== mostrado) {
          enlace('upcoming', prox.url, inicio <= ahora ? 'Próximo directo · empieza en breve' : 'Próximo directo · ' + cuando(inicio), prox.title, 'Ver en YouTube →');
        }
        if (row.children.length) b.classList.add('is-on');
      }).catch(function () {});
    })();
  </script>
  <div class="box">
    <p class="kicker">Resurgir Nacional</p>
    <h1>Esta página no existe</h1>
    <p>El enlace puede estar roto o la página fue movida.</p>
    <nav class="links">
      <a href="https://resurgirnacionaluy.org/">Inicio</a>
      <a href="https://resurgirnacionaluy.org/vision.html">Ideario</a>
      <a href="https://resurgirnacionaluy.org/SagradoCorazondeJesus.html">Fe</a>
      <a href="https://resurgirnacionaluy.org/formacion.html">Formación</a>
    </nav>
  </div>
</body>
</html>
