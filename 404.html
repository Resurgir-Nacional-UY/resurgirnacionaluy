<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Página no encontrada — Resurgir Nacional</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" />
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 130% at 50% 0%, #24579C 0%, #1B3F73 45%, #14315C 100%);
    color: #F4F2EA; font-family: "Fraunces", Georgia, serif; text-align: center; padding: 2rem;
  }
  .box { max-width: 34rem; }
  .kicker { font-family: "Archivo", system-ui, sans-serif; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; font-size: 0.72rem; color: #E7C978; }
  h1 { font-weight: 600; font-size: clamp(1.8rem, 1.4rem + 2vw, 2.8rem); margin: 1rem 0 0.6rem; }
  p { color: #E7E3D6; font-size: 1.05rem; line-height: 1.6; margin: 0 0 1.8rem; }
  .links { display: flex; gap: 0.8rem 1.6rem; flex-wrap: wrap; justify-content: center; font-family: "Archivo", sans-serif; font-weight: 600; font-size: 0.82rem; letter-spacing: 0.1em; text-transform: uppercase; }
  .links a { color: #F4F2EA; text-decoration: none; border-bottom: 2px solid #C6A24C; padding-bottom: 2px; }
  .links a:hover { color: #fff; }
  .live-banner { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 10; background: #B3261E; }
  .live-banner.is-live, .live-banner.is-recent { display: block; }
  .live-banner.is-recent { background: #14315C; border-bottom: 1px solid rgba(255,255,255,0.2); }
  .live-banner.is-recent .live-banner__dot { display: none; }
  .live-banner__link { display: flex; align-items: center; justify-content: center; gap: 0.6rem; max-width: 1120px; margin-inline: auto; padding: 0.55rem 1rem; color: #fff; text-decoration: none; font-family: "Archivo", sans-serif; font-size: 0.85rem; flex-wrap: wrap; }
  .live-banner__link:hover { opacity: 0.88; }
  .live-banner__dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; flex: none; }
  .live-banner__label { font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .live-banner__title { opacity: 0.92; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40ch; }
  .live-banner__cta { font-weight: 600; text-decoration: underline; white-space: nowrap; }
</style>
</head>
<body>
  <div class="live-banner" id="live-banner">
    <a class="live-banner__link" id="live-banner-link" href="https://www.youtube.com/@ResurgirNacional/live" target="_blank" rel="noopener">
      <span class="live-banner__dot" aria-hidden="true"></span>
      <span class="live-banner__label">Estamos en vivo ahora</span>
      <span class="live-banner__title" id="live-banner-title"></span>
      <span class="live-banner__cta">Ver en YouTube →</span>
    </a>
  </div>
  <script>
    (function () {
      var b = document.getElementById('live-banner');
      fetch('/live-status.json', { cache: 'no-store' }).then(function (r) {
        return r.ok ? r.json() : null;
      }).then(function (d) {
        if (!d || !d.url) return;
        var label = b.querySelector('.live-banner__label');
        var cta = b.querySelector('.live-banner__cta');
        if (d.live) {
          b.classList.add('is-live');
        } else {
          var ended = d.endedAt ? Date.parse(d.endedAt) : NaN;
          var ms = Date.now() - ended;
          if (isNaN(ended) || ms > 6 * 3600 * 1000) return;
          var min = Math.max(1, Math.round(ms / 60000));
          label.textContent = 'Directo finalizado · hace ' + (min < 60 ? min + ' min' : Math.round(min / 60) + ' h');
          cta.textContent = 'Ver grabación →';
          b.classList.add('is-recent');
        }
        document.getElementById('live-banner-link').href = d.url;
        if (d.title) document.getElementById('live-banner-title').textContent = '— ' + d.title;
      }).catch(function () {});
    })();
  </script>
  <div class="box">
    <p class="kicker">Resurgir Nacional</p>
    <h1>Esta página no existe</h1>
    <p>El enlace puede estar roto o la página fue movida.</p>
    <nav class="links">
      <a href="https://resurgirnacionaluy.org/">Inicio</a>
      <a href="https://resurgirnacionaluy.org/vision.html">Ideario</a>
      <a href="https://resurgirnacionaluy.org/SagradoCorazondeJesus.html">Fe</a>
      <a href="https://resurgirnacionaluy.org/formacion.html">Formación</a>
    </nav>
  </div>
</body>
</html>
