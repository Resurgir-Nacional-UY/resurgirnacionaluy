name: Formación · render artículos

on:
  push:
    branches: [main]
    paths:
      - "content/formacion/**"
      - "media/formacion/**"
      - "scripts/render_articles.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: formacion-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet markdown pyyaml

      - run: python scripts/render_articles.py

      - name: Publicar cambios
        run: |
          git config user.name "resurgir-bot"
          git config user.email "avvedit@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "Formación: regenerar artículos [skip ci]"
            git push
          fi
