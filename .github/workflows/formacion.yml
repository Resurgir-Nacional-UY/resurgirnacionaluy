name: Formación · render artículos

on:
  push:
    branches: [main]
    paths:
      - "content/formacion/**"
      - "media/formacion/**"
      - "content/biblioteca/**"
      - "scripts/render_articles.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: formacion-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Token de un admin: puede publicar en main aunque la regla exija PR.
          token: ${{ secrets.PUSH_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet markdown pyyaml Pillow

      - run: python scripts/render_articles.py

      - name: Publicar cambios
        run: |
          git config user.name "resurgir-bot"
          git config user.email "avvedit@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "Formación: regenerar artículos [skip ci]"
            for i in 1 2 3 4 5; do
              git push && exit 0
              git fetch origin main
              git rebase origin/main
              sleep $((RANDOM % 5 + 1))
            done
            git push
          fi
