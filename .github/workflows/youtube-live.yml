name: YouTube · chequear si esta en vivo

on:
  schedule:
    # Cada 20 minutos. La busqueda de "en vivo" cuesta 100 unidades de
    # cuota por llamada (limite gratuito: 10000/dia) -- a cada 20 min son
    # ~7200/dia, dejando margen para corridas manuales el mismo dia.
    - cron: "*/20 * * * *"
  push:
    branches: [main]
    paths:
      # Interruptor manual del CMS (Páginas > Transmisión en vivo): corre
      # al toque al publicarse, sin esperar el proximo cron.
      - "content/pages/live.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-live
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # El token y la API key solo existen en este environment, que GitHub
    # limita a la rama main: una rama de un colaborador no puede leerlos.
    environment: publicar
    steps:
      - uses: actions/checkout@v4
        with:
          # Token de un admin: puede publicar en main aunque la regla exija PR.
          token: ${{ secrets.PUSH_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml

      - name: Consultar YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/check_youtube_live.py

      - name: Publicar cambios
        run: |
          git config user.name "resurgir-bot"
          git config user.email "avvedit@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "YouTube: actualizar estado en vivo [skip ci]"
            for i in 1 2 3 4 5; do
              git push && exit 0
              git fetch origin main
              git rebase origin/main
              sleep $((RANDOM % 5 + 1))
            done
            git push
          fi
