name: Financiamiento · render página

on:
  push:
    branches: [main]
    paths:
      - "content/pages/financiamiento.yml"
      - "scripts/render_financiamiento.py"
      # La pagina copia el header, el footer y los estilos de Ideario: si
      # cambian ahi, hay que regenerarla para que no quede desactualizada.
      - "ideario-y-valores-rn.html"
      # Los botones de aportar de las iniciativas usan los links de PayPal, Ko-fi
      # y la cuenta Prex de la portada.
      - "content/pages/home.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: financiamiento-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    # El token solo existe en este environment, que GitHub limita a la rama main:
    # una rama de un colaborador no puede leerlo.
    environment: publicar
    steps:
      - uses: actions/checkout@v4
        with:
          # Token de un admin: puede publicar en main aunque la regla exija PR.
          token: ${{ secrets.PUSH_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml

      # Una sola pagina: si el render falla no hay nada que publicar, asi
      # que el job corta aca (en rojo, y GitHub avisa por correo).
      - name: Render
        run: python scripts/render_financiamiento.py

      - name: Publicar cambios
        run: |
          git config user.name "resurgir-bot"
          git config user.email "avvedit@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "Financiamiento: regenerar página [skip ci]"
            for i in 1 2 3 4 5; do
              git push && exit 0
              git fetch origin main
              git rebase origin/main
              sleep $((RANDOM % 5 + 1))
            done
            git push
          fi
