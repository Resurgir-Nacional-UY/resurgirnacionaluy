name: Tienda · render productos

on:
  push:
    branches: [main]
    paths:
      - "content/tienda/**"
      - "media/tienda/**"
      - "scripts/render_tienda.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tienda-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml Pillow

      - run: python scripts/render_tienda.py

      - name: Publicar cambios
        run: |
          git config user.name "resurgir-bot"
          git config user.email "avvedit@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "Tienda: regenerar productos [skip ci]"
            for i in 1 2 3 4 5; do
              git push && exit 0
              git fetch origin main
              git rebase origin/main
              sleep $((RANDOM % 5 + 1))
            done
            git push
          fi
