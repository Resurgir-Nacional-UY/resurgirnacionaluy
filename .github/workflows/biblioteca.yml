name: Biblioteca · render libros

on:
  push:
    branches: [main]
    paths:
      - "content/biblioteca/**"
      - "media/biblioteca/**"
      - "scripts/render_biblioteca.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: biblioteca-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml Pillow

      - run: python scripts/render_biblioteca.py

      - name: Publicar cambios
        run: |
          git config user.name "resurgir-bot"
          git config user.email "avvedit@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "Biblioteca: regenerar libros [skip ci]"
            git push
          fi
