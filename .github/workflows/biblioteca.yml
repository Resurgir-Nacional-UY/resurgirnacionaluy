name: Biblioteca · render libros

on:
  push:
    branches: [main]
    paths:
      - "content/biblioteca/**"
      - "media/biblioteca/**"
      - "scripts/render_biblioteca.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: biblioteca-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    # El token solo existe en este environment, que GitHub limita a la rama main:
    # una rama de un colaborador no puede leerlo.
    environment: publicar
    steps:
      - uses: actions/checkout@v4
        with:
          # Token de un admin: puede publicar en main aunque la regla exija PR.
          token: ${{ secrets.PUSH_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml Pillow

      # continue-on-error: un libro con un PDF que nunca llego al repo (o
      # cualquier otro problema de un solo item) corta este script con
      # ERROR, pero el resto de la Biblioteca ya se termino de renderizar
      # bien -- eso SI hay que publicarlo (paso siguiente). El job igual
      # termina en rojo mas abajo para que GitHub avise por correo.
      - name: Render
        id: render
        run: python scripts/render_biblioteca.py
        continue-on-error: true

      - name: Publicar cambios
        run: |
          git config user.name "resurgir-bot"
          git config user.email "avvedit@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "Biblioteca: regenerar libros [skip ci]"
            for i in 1 2 3 4 5; do
              git push && exit 0
              git fetch origin main
              git rebase origin/main
              sleep $((RANDOM % 5 + 1))
            done
            git push
          fi

      - name: Marcar el run como fallido si el render tuvo errores
        if: steps.render.outcome == 'failure'
        run: exit 1
