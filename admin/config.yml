# Sveltia CMS — editor de Formación
# Autenticación: GitHub. Los "usuarios autorizados" son los miembros del equipo
# "redactores" de la organización Resurgir-Nacional-UY (con permiso Write sobre
# este repositorio).
#
# Login "Iniciar sesión con GitHub" de un clic vía el worker de OAuth
# sveltia-cms-auth en Cloudflare (base_url). También sigue disponible el login
# con token de acceso personal. Ver README-CMS.md.

backend:
  name: github
  repo: Resurgir-Nacional-UY/resurgirnacionaluy
  branch: main
  base_url: https://sveltia-cms-auth.avvedit.workers.dev

# Cada guardado abre un Pull Request; el artículo se publica al aprobarlo (merge).
publish_mode: editorial_workflow

# Imágenes subidas desde el editor. public_folder sin barra inicial: las páginas
# viven en la raíz del sitio de proyecto (/resurgirnacionaluy/), así que la ruta
# relativa resuelve bien tanto en formacion.html como en cada artículo.
media_folder: media/formacion
public_folder: media/formacion

collections:
  - name: pages
    label: Páginas
    files:
      - name: home
        label: "Portada — textos e imágenes"
        file: content/pages/home.yml
        media_folder: /media/pages
        public_folder: /media/pages
        fields:
          - name: hero_lead
            label: "Texto principal (debajo del título)"
            widget: text

          - name: hero_video
            label: "Video de fondo — sección de inicio"
            widget: file
            hint: "Un video corto en loop (MP4, sin audio). Pesos grandes hacen la web más lenta: idealmente menos de 3 MB."

          - name: sumate_video
            label: "Video de fondo — sección Sumarse"
            widget: file
            hint: "Un video corto en loop (MP4, sin audio). Pesos grandes hacen la web más lenta: idealmente menos de 3 MB."

      - name: vision
        label: "Visión — imagen de fondo"
        file: content/pages/vision.yml
        media_folder: /media/pages
        public_folder: /media/pages
        fields:
          - name: hero_video
            label: "Video de fondo (bandera)"
            widget: file
            hint: "Un video corto en loop (MP4, sin audio)."

      - name: fe
        label: "Fe — imágenes de fondo"
        file: content/pages/fe.yml
        media_folder: /media/pages
        public_folder: /media/pages
        fields:
          - name: bg_scj
            label: "Imagen de fondo — derecha (Cristo Rey)"
            widget: image

          - name: bg_icdm
            label: "Imagen de fondo — izquierda (Inmaculado Corazón)"
            widget: image

      - name: formacion_page
        label: "Formación — video de presentación"
        file: content/pages/formacion.yml
        media_folder: /media/pages
        public_folder: /media/pages
        fields:
          - name: video_youtube_id
            label: "ID del video de YouTube"
            widget: string
            hint: >-
              La parte del link de YouTube después de "v=" o "youtu.be/". Por
              ejemplo, en https://youtu.be/Glzx6Y9uhLI el ID es Glzx6Y9uhLI.

          - name: video_thumb
            label: "Miniatura (imagen que se ve antes de reproducir)"
            widget: image

  - name: formacion
    label: Artículos de Formación
    label_singular: Artículo
    description: >-
      Ensayos y textos del movimiento. Al guardar se crea un Pull Request;
      queda publicado cuando alguien con permiso lo aprueba (merge).
    folder: content/formacion
    create: true
    slug: "{{fields.slug}}"
    identifier_field: title
    summary: "{{title}} · {{date}}"
    sortable_fields:
      - date
      - title
    fields:
      - name: title
        label: Título
        widget: string

      - name: slug
        label: "Slug (parte final de la URL)"
        widget: string
        hint: "solo minúsculas, números y guiones — p. ej. la-soberania-nacional da /la-soberania-nacional.html"
        pattern:
          - "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          - "Solo minúsculas, números y guiones"

      - name: date
        label: Fecha
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false

      - name: author
        label: Autor
        widget: string
        default: "Resurgir Nacional"

      - name: summary
        label: "Resumen (para el listado y la vista previa)"
        widget: text

      - name: source_url
        label: "Enlace externo — opcional, p. ej. el hilo en X"
        widget: string
        required: false

      - name: draft
        label: "Borrador (no se publica mientras esté marcado)"
        widget: boolean
        default: false

      - name: body
        label: "Cuerpo del artículo"
        widget: markdown
