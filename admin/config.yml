# Sveltia CMS — editor de Formación
# Autenticación: GitHub. Los "usuarios autorizados" son los miembros del equipo
# "redactores" de la organización Resurgir-Nacional-UY (con permiso Write sobre
# este repositorio).
#
# Login "Iniciar sesión con GitHub" de un clic vía el worker de OAuth
# sveltia-cms-auth en Cloudflare (base_url). También sigue disponible el login
# con token de acceso personal. Ver README-CMS.md.

backend:
  name: github
  repo: Resurgir-Nacional-UY/resurgirnacionaluy
  branch: main
  base_url: https://sveltia-cms-auth.avvedit.workers.dev

# Cada guardado abre un Pull Request; el artículo se publica al aprobarlo (merge).
publish_mode: editorial_workflow

# Imágenes subidas desde el editor. public_folder sin barra inicial: las páginas
# viven en la raíz del sitio de proyecto (/resurgirnacionaluy/), así que la ruta
# relativa resuelve bien tanto en cultura-nacional-uruguaya.html como en cada artículo.
media_folder: media/formacion
public_folder: media/formacion

collections:
  - name: pages
    label: Páginas
    files:
      - name: home
        label: "Portada, menú y pie — todo el texto"
        file: content/pages/home.yml
        media_folder: /media/pages
        public_folder: /media/pages
        fields:
          - name: hero_eyebrow
            label: "Portada — etiqueta sobre el título"
            widget: string
          - name: hero_lead
            label: "Portada — texto principal (debajo del título)"
            widget: text
          - name: hero_cta1_text
            label: "Portada — botón 1"
            widget: string
          - name: hero_cta2_text
            label: "Portada — botón 2"
            widget: string
          - name: hero_video
            label: "Portada — video de fondo (sección de inicio)"
            widget: file
            hint: "Un video corto en loop (MP4, sin audio). Pesos grandes hacen la web más lenta: idealmente menos de 3 MB."

          - name: nav_vision
            label: "Menú — Visión"
            widget: string
            hint: "Este grupo de 6 etiquetas es el menú de arriba Y el pie de página — se usan en las 5 páginas del sitio."
          - name: nav_ideario
            label: "Menú — Ideario"
            widget: string
          - name: nav_fe
            label: "Menú — Fe"
            widget: string
          - name: nav_formacion
            label: "Menú — Formación"
            widget: string
          - name: nav_tienda
            label: "Menú — Tienda"
            widget: string
          - name: nav_colabora
            label: "Menú — Colabora"
            widget: string
          - name: nav_sumate
            label: "Menú — Súmate"
            widget: string

          - name: ideario_label
            label: "Sección Visión (portada) — etiqueta"
            widget: string
          - name: ideario_heading
            label: "Sección Visión (portada) — título"
            widget: string
          - name: ideario_intro
            label: "Sección Visión (portada) — introducción"
            widget: text
          - name: ideario_values
            label: "Sección Visión (portada) — los 12 valores"
            widget: list
            min: 12
            max: 12
            hint: "Son exactamente 12 — se puede editar el texto de cada uno, pero no agregar ni quitar. Es el resumen corto de la portada; el texto largo está en la sección Visión."
            fields:
              - { name: title, label: "Título", widget: string }
              - { name: body, label: "Texto", widget: string }

          - name: aporta_label
            label: "Sección Colaborar — etiqueta"
            widget: string
          - name: aporta_heading
            label: "Sección Colaborar — título"
            widget: string
          - name: aporta_tiers
            label: "Sección Colaborar — recuadros de cuota"
            widget: list
            min: 3
            max: 3
            hint: "Son exactamente 3 — se puede editar el texto de cada uno, pero no agregar ni quitar."
            fields:
              - { name: name, label: "Nombre", widget: string }
              - { name: amount, label: "Monto", widget: string }
              - { name: use, label: "Descripción", widget: text }
          - name: aporta_note
            label: "Sección Colaborar — nota sobre el destino del dinero"
            widget: text
          - name: aporta_paypal
            label: "Sección Colaborar — link de PayPal"
            widget: string
          - name: aporta_kofi
            label: "Sección Colaborar — link de Ko-fi"
            widget: string
          - name: aporta_prex
            label: "Sección Colaborar — número de cuenta Prex"
            widget: string
            required: false
            hint: >-
              Se muestra con un botón para copiarlo, en Colaborar y en las
              colectas de eventos. Si lo dejás vacío, Prex no aparece.

          - name: sumate_label
            label: "Sección Sumarse — etiqueta"
            widget: string
          - name: sumate_heading
            label: "Sección Sumarse — título"
            widget: string
          - name: sumate_p1
            label: "Sección Sumarse — párrafo 1"
            widget: text
          - name: sumate_p2
            label: "Sección Sumarse — párrafo 2"
            widget: text
          - name: sumate_contact_label
            label: "Sección Sumarse — texto antes del correo"
            widget: string
          - name: sumate_video
            label: "Sección Sumarse — video de fondo"
            widget: file
            hint: "Un video corto en loop (MP4, sin audio). Pesos grandes hacen la web más lenta: idealmente menos de 3 MB."

          - name: contact_email
            label: "Correo de contacto"
            widget: string
            hint: "Se usa en toda la web (Portada, Formación y el pie de las 5 páginas) — cambiarlo acá lo actualiza en todos lados."

      - name: vision
        label: "Visión — texto e imagen de fondo"
        file: content/pages/vision.yml
        media_folder: /media/pages
        public_folder: /media/pages
        fields:
          - name: hero_video
            label: "Video de fondo (bandera)"
            widget: file
            hint: "Un video corto en loop (MP4, sin audio)."

          - name: sec1_heading
            label: "Sección 1 — título"
            widget: string
          - name: sec1_p1
            label: "Sección 1 — párrafo 1"
            widget: text
          - name: sec1_pullquote
            label: "Sección 1 — frase destacada"
            widget: text
            hint: "Se muestra en grande, entre el párrafo 1 y el 2."
          - name: sec1_p2
            label: "Sección 1 — párrafo 2"
            widget: text
          - name: sec1_p3
            label: "Sección 1 — párrafo 3"
            widget: text
          - name: sec1_p4
            label: "Sección 1 — párrafo 4"
            widget: text

          - name: sec2_heading
            label: "Sección 2 — título"
            widget: string
          - name: sec2_p1
            label: "Sección 2 — párrafo 1"
            widget: text
          - name: sec2_p2
            label: "Sección 2 — párrafo 2"
            widget: text

          - name: sec3_heading
            label: "Sección 3 — título"
            widget: string
          - name: sec3_values
            label: "Los doce principios"
            widget: list
            min: 12
            max: 12
            hint: "Son exactamente 12 (están numerados en la página) — se puede editar el texto de cada uno, pero no agregar ni quitar."
            fields:
              - { name: title, label: "Título", widget: string }
              - { name: body, label: "Texto", widget: text }

          - name: sec4_heading
            label: "Sección 4 — título"
            widget: string
          - name: sec4_p1
            label: "Sección 4 — párrafo 1"
            widget: text
          - name: sec4_p2
            label: "Sección 4 — párrafo 2"
            widget: text
          - name: sec4_p3
            label: "Sección 4 — párrafo 3"
            widget: text
          - name: sec4_facts
            label: "Recuadros de cuota"
            widget: list
            min: 3
            max: 3
            hint: "Son exactamente 3 recuadros — se puede editar el texto de cada uno, pero no agregar ni quitar."
            fields:
              - { name: big, label: "Número o palabra grande", widget: string }
              - { name: label, label: "Descripción chica", widget: string }

          - name: sec5_heading
            label: "Sección 5 — título"
            widget: string
          - name: sec5_acts
            label: "Actividades"
            widget: list
            min: 7
            max: 7
            hint: "Son exactamente 7 tarjetas — se puede editar el texto de cada una, pero no agregar ni quitar."
            fields:
              - { name: title, label: "Título", widget: string }
              - { name: body, label: "Texto", widget: text }

      - name: fe
        label: "Fe — texto e imágenes de fondo"
        file: content/pages/fe.yml
        media_folder: /media/pages
        public_folder: /media/pages
        fields:
          - name: hero_label
            label: "Portada — etiqueta (encima del título)"
            widget: string
          - name: hero_title
            label: "Portada — título"
            widget: string
          - name: hero_sub
            label: "Portada — bajada (debajo del título)"
            widget: string

          - name: bg_scj
            label: "Imagen de fondo — derecha (Cristo Rey)"
            widget: image

          - name: bg_icdm
            label: "Imagen de fondo — izquierda (Inmaculado Corazón)"
            widget: image

          - name: sec1_lead
            label: "Bajada (debajo del título)"
            widget: string
          - name: sec1_p1
            label: "Introducción"
            widget: text

          - name: sec2_heading
            label: "Oración — título"
            widget: string
          - name: sec2_p1
            label: "Oración — línea 1"
            widget: text
          - name: sec2_p2
            label: "Oración — línea 2"
            widget: text
          - name: sec2_p3
            label: "Oración — línea 3"
            widget: text
          - name: sec2_p4
            label: "Oración — línea 4"
            widget: text
          - name: sec2_p5
            label: "Oración — línea 5"
            widget: text
          - name: sec2_p6
            label: "Oración — línea 6"
            widget: text
          - name: sec2_invocations
            label: "Invocaciones"
            widget: text
            hint: "Dos frases cortas, una por línea."

          - name: sec3_heading
            label: "Segunda oración — título"
            widget: string
          - name: sec3_p1
            label: "Segunda oración — línea 1"
            widget: text
          - name: sec3_p2
            label: "Segunda oración — línea 2"
            widget: text
          - name: sec3_p3
            label: "Segunda oración — línea 3"
            widget: text
          - name: sec3_p4
            label: "Segunda oración — línea 4"
            widget: text
          - name: sec3_p5
            label: "Segunda oración — línea 5"
            widget: text

          - name: sec4_heading
            label: "Oración a Jacinto Vera — título"
            widget: string
          - name: sec4_p1
            label: "Oración a Jacinto Vera — párrafo 1"
            widget: text
          - name: sec4_p2
            label: "Oración a Jacinto Vera — párrafo 2 (peticiones)"
            widget: text
          - name: sec4_p3
            label: "Oración a Jacinto Vera — párrafo 3"
            widget: text
          - name: sec4_p4
            label: "Oración a Jacinto Vera — párrafo 4"
            widget: text
          - name: sec4_p5
            label: "Oración a Jacinto Vera — párrafo 5"
            widget: text
          - name: sec4_p6
            label: "Oración a Jacinto Vera — cierre"
            widget: text

      - name: formacion_page
        label: "Formación — texto y video de presentación"
        file: content/pages/formacion.yml
        media_folder: /media/pages
        public_folder: /media/pages
        fields:
          - name: doc_lead
            label: "Bajada (debajo del título)"
            widget: string

          - name: video_title
            label: "Título del video de presentación"
            widget: string
          - name: video_youtube_id
            label: "ID del video de YouTube"
            widget: string
            hint: >-
              La parte del link de YouTube después de "v=" o "youtu.be/". Por
              ejemplo, en https://youtu.be/Glzx6Y9uhLI el ID es Glzx6Y9uhLI.
          - name: video_thumb
            label: "Miniatura (imagen que se ve antes de reproducir)"
            widget: image

          - name: articles_intro
            label: "Introducción a la lista de artículos"
            widget: text

          - name: x_post_url
            label: "Último artículo en X — link"
            widget: string
            hint: "Se actualiza a mano cada vez que se comparte un artículo nuevo en X (X no permite mostrarlo automáticamente)."
          - name: x_post_title
            label: "Último artículo en X — título"
            widget: string
          - name: x_post_excerpt
            label: "Último artículo en X — cita corta"
            widget: text

          - name: write_cta_heading
            label: "Invitación a colaborar — título"
            widget: string
          - name: write_cta_body
            label: "Invitación a colaborar — texto"
            widget: text

      - name: tienda_page
        label: "Tienda — configuración"
        file: content/pages/tienda.yml
        fields:
          - name: lead
            label: "Bajada (debajo del título)"
            widget: text
          - name: paypal_client_id
            label: "PayPal — Client ID"
            widget: string
            required: false
            hint: >-
              El Client ID público de la app de PayPal (no el Secret — ese va
              como secreto en Cloudflare, nunca acá). En
              developer.paypal.com → Apps & Credentials.
          - name: api_base
            label: "URL base de la función de pago (Cloudflare Worker)"
            widget: string
            required: false
            hint: "Ej: https://tienda-api.<cuenta>.workers.dev (sin barra final)."
          - name: shipping_note
            label: "Aviso sobre el envío en el carrito"
            widget: string

      - name: financiamiento
        label: "Financiamiento — iniciativas y resumen"
        file: content/pages/financiamiento.yml
        media_folder: /media/pages
        public_folder: /media/pages
        fields:
          - name: ejemplo
            label: "¿Son datos de ejemplo?"
            widget: boolean
            default: false
            hint: "Mientras esté activado, la página muestra un aviso de que los montos no son reales."
          - name: lead
            label: "Bajada (debajo del título)"
            widget: text
          - name: moneda
            label: "Símbolo de la moneda"
            widget: string
            default: "$"
          - name: iniciativas
            label: "Iniciativas"
            widget: list
            required: false
            hint: >-
              Cada iniciativa muestra su meta, una barra de lo recaudado y la
              cantidad de aportes. Este archivo es público en GitHub: cargá solo
              totales. El detalle de cada aporte va en la planilla interna.
            fields:
              - { name: nombre, label: "Nombre (ej: Presentación de libro)", widget: string }
              - { name: imagen, label: "Imagen", widget: image, required: false }
              - { name: descripcion, label: "Para qué es el dinero", widget: text, required: false }
              - { name: meta, label: "Meta (en pesos)", widget: number, value_type: int }
              - name: recaudado
                label: "Total recaudado hasta ahora (en pesos)"
                widget: number
                value_type: int
                default: 0
                hint: "La suma de todos los aportes. Si llegaron en dólares, el equivalente en pesos."
              - { name: aportes, label: "Cantidad de aportes", widget: number, value_type: int, default: 0 }
              - name: nombres
                label: "Nombres a agradecer"
                widget: list
                required: false
                hint: >-
                  Solo quienes pidieron figurar, sin montos. El resto se muestra
                  como «y N personas más».
              - { name: fecha_limite, label: "Fecha límite", widget: datetime, time_format: false, format: "YYYY-MM-DD", required: false }
              - name: lograda
                label: "¿Iniciativa terminada?"
                widget: boolean
                default: false
                hint: "Deja de pedir aportes y pasa a «Iniciativas logradas» con su resultado."
              - { name: resultado, label: "Resultado: qué se hizo con lo recaudado", widget: text, required: false }
              - { name: resultado_imagen, label: "Resultado: foto", widget: image, required: false }
          - name: resumen_periodo
            label: "Resumen — período de los porcentajes (ej: año 2026)"
            widget: string
            required: false
          - name: fuentes
            label: "De dónde viene el dinero"
            widget: list
            required: false
            hint: "Con porcentaje se muestra una barra repartida; sin porcentaje, solo las tarjetas. Deberían sumar 100."
            fields:
              - { name: nombre, label: "Fuente (ej: Cuotas de miembros)", widget: string }
              - { name: descripcion, label: "Descripción corta", widget: text, required: false }
              - { name: porcentaje, label: "Porcentaje del total", widget: number, value_type: float, required: false }
          - name: usos
            label: "En qué se usa"
            widget: list
            required: false
            hint: "Con porcentaje se muestra una barra repartida; sin porcentaje, solo las tarjetas. Deberían sumar 100."
            fields:
              - { name: nombre, label: "Uso (ej: Redes sociales)", widget: string }
              - { name: descripcion, label: "Descripción corta", widget: text, required: false }
              - { name: porcentaje, label: "Porcentaje del total", widget: number, value_type: float, required: false }
          - name: usos_por_mes
            label: "Mes a mes — en qué se usó el dinero"
            widget: list
            required: false
            hint: >-
              Cada mes se muestra con un gráfico de torta, solo con porcentajes
              (sin montos). El primero de la lista es el más reciente. Los %
              salen del Resumen de la planilla interna, con Desde/Hasta en ese mes.
            fields:
              - { name: mes, label: "Mes (ej: Octubre 2026)", widget: string }
              - name: usos
                label: "En qué se usó"
                widget: list
                hint: "Usá los mismos nombres de «En qué se usa» para que cada categoría mantenga su color. Deberían sumar 100."
                fields:
                  - { name: nombre, label: "Categoría (ej: Redes sociales)", widget: string }
                  - { name: porcentaje, label: "Porcentaje", widget: number, value_type: float }
              - { name: nota, label: "Aclaración (opcional)", widget: text, required: false }

      - name: live
        label: "🔴 Transmisión en vivo"
        file: content/pages/live.yml
        fields:
          - name: live_now
            label: "¿Hay una transmisión en vivo ahora mismo?"
            widget: boolean
            default: false
            hint: >-
              Activalo cuando arranques la transmisión en YouTube: en pocos
              minutos aparece el aviso "Estamos EN VIVO ahora" con el link a
              tu transmisión en todas las páginas, y reemplaza cualquier aviso
              anterior (también el de "Directo finalizado"). Si ya estaba
              activado y arrancás OTRO directo, desactivalo, guardá, y volvé a
              activarlo para reiniciar el aviso y el link. No hace falta
              apagarlo al cortar: cuando YouTube confirma que terminó, el aviso
              pasa solo a "Directo finalizado" (queda 6 horas, salvo que
              empiece otro directo antes). Si YouTube nunca llega a ver la
              transmisión, el aviso manual se apaga solo a las 12 horas.

  - name: formacion
    label: Artículos de Formación
    label_singular: Artículo
    description: >-
      Ensayos y textos del movimiento. Al guardar se crea un Pull Request;
      queda publicado cuando alguien con permiso lo aprueba (merge).
    folder: content/formacion
    create: true
    slug: "{{fields.slug}}"
    identifier_field: title
    summary: "{{title}} · {{date}}"
    sortable_fields:
      - date
      - title
    fields:
      - name: title
        label: Título
        widget: string

      - name: slug
        label: "Slug (parte final de la URL)"
        widget: string
        hint: "solo minúsculas, números y guiones — p. ej. la-soberania-nacional da /la-soberania-nacional.html"
        pattern:
          - "^[a-z0-9]+(?:-[a-z0-9]+)+$"
          - "Separa las palabras con guiones, todo en minúsculas (ej: la-soberania-nacional). Mejora cómo Google lee la URL."

      - name: date
        label: Fecha
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false

      - name: author
        label: Autor
        widget: string
        default: "Resurgir Nacional"

      - name: tema
        label: "Temática (para el índice agrupado)"
        widget: select
        options:
          - "Teoría política"
          - "Historia nacional"
          - "Fe católica"
          - "Cultura y sociedad"
          - "Economía social"

      - name: summary
        label: "Resumen (para el listado y la vista previa)"
        widget: text

      - name: source_url
        label: "Enlace externo — opcional, p. ej. el hilo en X"
        widget: string
        required: false

      - name: draft
        label: "Borrador (no se publica mientras esté marcado)"
        widget: boolean
        default: false

      - name: body
        label: "Cuerpo del artículo"
        widget: markdown

  - name: biblioteca
    label: Biblioteca
    label_singular: Libro
    description: >-
      Libros en PDF de dominio público. Al guardar se crea un Pull Request;
      queda publicado cuando alguien con permiso lo aprueba (merge).
    folder: content/biblioteca
    create: true
    extension: yaml
    format: yaml
    slug: "{{fields.slug}}"
    identifier_field: title
    summary: "{{title}} · {{author}} · {{year}}"
    sortable_fields:
      - year
      - title
    media_folder: /media/biblioteca
    public_folder: /media/biblioteca
    fields:
      - name: title
        label: Título
        widget: string

      - name: slug
        label: "Slug (parte final de la URL)"
        widget: string
        hint: "solo minúsculas, números y guiones — p. ej. jacinto-vera da /jacinto-vera.html"
        pattern:
          - "^[a-z0-9]+(?:-[a-z0-9]+)+$"
          - "Separa las palabras con guiones, todo en minúsculas (ej: la-soberania-nacional). Mejora cómo Google lee la URL."

      - name: author
        label: Autor
        widget: string

      - name: tema
        label: "Temática (para el índice agrupado)"
        widget: select
        options:
          - "Teoría política"
          - "Historia nacional"
          - "Fe católica"
          - "Cultura y sociedad"
          - "Economía social"

      - name: year
        label: "Año de edición"
        widget: string

      - name: summary
        label: "Resumen (para la tarjeta y la vista previa)"
        widget: text

      - name: pdf
        label: "Archivo PDF"
        widget: file
        media_library:
          config:
            max_file_size: 60000000

      - name: pages
        label: "Cantidad de páginas (opcional)"
        widget: number
        value_type: int
        required: false

      - name: draft
        label: "Borrador (no se publica mientras esté marcado)"
        widget: boolean
        default: false

  - name: tienda
    label: Tienda
    label_singular: Producto
    description: >-
      Merchandising y libros a la venta. Al guardar se crea un Pull Request;
      queda publicado cuando alguien con permiso lo aprueba (merge).
    folder: content/tienda
    create: true
    extension: yml
    format: yaml
    slug: "{{fields.slug}}"
    identifier_field: title
    summary: "{{title}} · {{type}} · USD {{price}}"
    sortable_fields:
      - title
      - price
      - type
    media_folder: /media/tienda
    public_folder: /media/tienda
    fields:
      - name: title
        label: Título
        widget: string

      - name: slug
        label: "Slug (parte final de la URL)"
        widget: string
        hint: "solo minúsculas, números y guiones — p. ej. remera-sol da /remera-sol.html"
        pattern:
          - "^[a-z0-9]+(?:-[a-z0-9]+)+$"
          - "Separa las palabras con guiones, todo en minúsculas (ej: la-soberania-nacional). Mejora cómo Google lee la URL."

      - name: type
        label: Tipo de producto
        widget: select
        options:
          - { label: "Merchandising", value: "merch" }
          - { label: "Libro digital (PDF)", value: "libro_digital" }
          - { label: "Libro físico", value: "libro_fisico" }

      - name: price
        label: "Precio (dólares, USD)"
        widget: number
        value_type: float
        min: 0
        hint: >-
          PayPal no admite cobrar en pesos uruguayos — el precio se carga y
          se cobra en dólares (USD).

      - name: summary
        label: "Resumen (para la tarjeta)"
        widget: text

      - name: description
        label: "Descripción completa"
        widget: text
        required: false

      - name: images
        label: "Imágenes (la primera es la principal)"
        widget: list
        field: { name: image, label: Imagen, widget: image }
        min: 1
        max: 6

      - name: variant_label
        label: "Nombre de la variante (p. ej. Talle) — opcional"
        widget: string
        required: false
        hint: "Dejar vacío si el producto no tiene variantes."

      - name: variant_options
        label: "Opciones de la variante, separadas por coma (p. ej. S,M,L,XL)"
        widget: string
        required: false

      - name: stock
        label: "Stock disponible (vacío = sin límite / digital)"
        widget: number
        value_type: int
        required: false
        hint: "Se actualiza a mano después de cada venta — no se descuenta solo."

      - name: digital_asset_key
        label: "Clave del archivo en R2 (solo libro digital)"
        widget: string
        required: false
        hint: >-
          NO subir el PDF acá (quedaría público). Subilo a Cloudflare R2 y
          pegá la clave del objeto, p. ej. libros/mi-libro.pdf.

      - name: pages
        label: "Cantidad de páginas (opcional, solo libros)"
        widget: number
        value_type: int
        required: false

      - name: draft
        label: "Borrador (no se publica mientras esté marcado)"
        widget: boolean
        default: false

  # ---- Fe: lecturas de la Santa Misa del día ----
  # Van después de "tienda" a propósito: scripts/make_admin_redactores.py solo
  # copia al CMS de articulistas lo que está entre "formacion" y "tienda".
  - name: lecturas
    label: "Fe · Lecturas del día"
    label_singular: "Lectura del día"
    description: >-
      Lecturas de la Santa Misa. Una entrada por fecha: se muestra en la página Fe el
      día que corresponde (hora de Montevideo). Al guardar se crea un Pull
      Request; queda publicada cuando alguien con permiso lo aprueba (merge).
    folder: content/lecturas
    create: true
    extension: yml
    format: yaml
    slug: "{{fields.fecha}}"
    identifier_field: fecha
    summary: "{{fecha}} · {{celebracion}}"
    sortable_fields:
      - fecha
    fields:
      - name: fecha
        label: "Fecha (AAAA-MM-DD)"
        widget: string
        hint: "Día en que se muestra, p. ej. 2026-10-07. Una sola entrada por día."
        pattern:
          - '^\d{4}-\d{2}-\d{2}$'
          - "Escribí la fecha como AAAA-MM-DD, p. ej. 2026-10-07."

      - name: celebracion
        label: "Celebración del día"
        widget: string
        hint: "P. ej. Miércoles de la XXVII semana del tiempo ordinario, o Santa Teresa de Jesús, virgen y doctora de la Iglesia (memoria obligatoria)."

      - name: santo
        label: "Memoria libre / santo del día — opcional"
        widget: string
        required: false
        hint: "P. ej. Memoria libre: San Bruno, presbítero. Dejar vacío si no hay."

      - name: fuente
        label: "Crédito del texto bíblico — opcional"
        widget: string
        required: false
        hint: "Se muestra al pie de las lecturas, p. ej. Texto bíblico: La Sagrada Biblia, traducción de Mons. Juan Straubinger."

      - name: lecturas
        label: "Lecturas (en el orden en que se leen)"
        widget: list
        summary: "{{fields.tipo}} · {{fields.cita}}"
        min: 1
        fields:
          - name: tipo
            label: Tipo
            widget: select
            options:
              - "Primera lectura"
              - "Salmo responsorial"
              - "Segunda lectura"
              - "Aclamación antes del Evangelio"
              - "Evangelio"

          - name: cita
            label: "Cita bíblica — p. ej. Gálatas 1, 13-24"
            widget: string
            required: false
            hint: "Con el nombre del libro completo (Gálatas, Salmo, Lucas), sin abreviar."

          - name: lema
            label: "Lema (frase en cursiva bajo la cita) — opcional"
            widget: string
            required: false

          - name: respuesta
            label: "Respuesta del salmo (R.) — solo salmo"
            widget: string
            required: false

          - name: presentacion
            label: "Presentación — p. ej. Lectura de la carta del apóstol san Pablo a los Gálatas"
            widget: string
            required: false

          - name: texto
            label: "Texto de la lectura"
            widget: text
            required: false
            hint: "Un párrafo por bloque; separar los párrafos con una línea en blanco. Una frase que empiece con « se muestra como diálogo."

          - name: estrofas
            label: "Estrofas (solo salmo y aclamación)"
            widget: text
            required: false
            hint: "Un verso por línea; separar las estrofas con una línea en blanco. Dejar la R/. al final de la estrofa tal como se lee."

          - name: cierre
            label: "Cierre — p. ej. Palabra de Dios."
            widget: string
            required: false

      - name: draft
        label: "Borrador (no se publica mientras esté marcado)"
        widget: boolean
        default: false

  # ---- Fe: calendario litúrgico del mes (pestaña "Calendario") ----
  - name: calendario
    label: "Fe · Calendario del mes"
    label_singular: "Calendario del mes"
    description: >-
      Una imagen y los datos de cada día para cada mes. La pestaña Calendario de la
      página Fe muestra solo el mes que corresponde (hora de Montevideo) y, abajo de
      "Hoy", únicamente el día de la fecha actual. Al guardar
      se crea un Pull Request; queda publicado cuando alguien con permiso lo aprueba (merge).
    folder: content/calendario
    create: true
    extension: yml
    format: yaml
    slug: "{{fields.mes}}"
    identifier_field: mes
    summary: "{{mes}} · {{titulo}}"
    media_folder: /media/calendario
    public_folder: /media/calendario
    sortable_fields:
      - mes
    fields:
      - name: mes
        label: "Mes (AAAA-MM)"
        widget: string
        hint: "P. ej. 2026-11. Una sola entrada por mes."
        pattern:
          - '^\d{4}-(0[1-9]|1[0-2])$'
          - "Escribí el mes como AAAA-MM, p. ej. 2026-11."

      - name: titulo
        label: "Título"
        widget: string
        hint: "P. ej. Noviembre 2026."

      - name: imagen
        label: "Imagen del calendario"
        widget: image
        choose_url: false
        hint: "La imagen del mes (p. ej. 1080×1350, mejor en WebP o JPG liviano)."

      - name: imagen_alt
        label: "Texto alternativo de la imagen"
        widget: text
        hint: "Describe la imagen para lectores de pantalla."

      - name: nota
        label: "Nota al pie de la imagen — opcional"
        widget: text
        required: false
        hint: "P. ej. aclaración de la cursiva y de los santos del martirologio. El crédito de la imagen va dentro de la imagen."

      - name: dias
        label: "Día por día (la página muestra solo el día de hoy)"
        widget: list
        summary: "{{fields.dia}} · {{fields.nombre}}"
        min: 1
        fields:
          - name: dia
            label: "Día del mes"
            widget: number
            value_type: int
            min: 1
            max: 31

          - name: nombre
            label: "Fiesta o santo del día"
            widget: string
            hint: "P. ej. Santa Teresa de Jesús, o XXVIII Domingo del Tiempo Ordinario."

          - name: tipo
            label: "Tipo"
            widget: select
            options:
              - { label: "Domingo", value: "domingo" }
              - { label: "Fiesta o solemnidad", value: "fiesta" }
              - { label: "Memoria obligatoria", value: "memoria-obligatoria" }
              - { label: "Memoria libre", value: "memoria-libre" }
              - { label: "Santo del martirologio (memoria libre)", value: "martirologio" }
              - { label: "Feria (sin santo)", value: "feria" }
              - { label: "Evento especial (p. ej. visita del papa)", value: "evento" }

          - name: detalle
            label: "Detalle — opcional"
            widget: string
            required: false
            hint: "P. ej. Patrona de las misiones, o Domund: Jornada Mundial de las Misiones."

          - name: tambien
            label: "Otras memorias libres del mismo día — opcional"
            widget: string
            required: false

      - name: draft
        label: "Borrador (no se publica mientras esté marcado)"
        widget: boolean
        default: false
